<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunday School Taranim - OBS & TV Presenter Window</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800&family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&family=Almarai:wght@400;700&family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background-color: transparent;
      font-family: 'Alexandria', sans-serif;
      cursor: default;
    }

    body[data-chroma="green"] { background-color: #00FF00 !important; }
    body[data-chroma="blue"] { background-color: #0000FF !important; }
    body[data-chroma="black"] { background-color: #000000 !important; }
    body[data-chroma="transparent"] { background-color: transparent !important; }

    /* MAGNETIC SNAP GUIDES */
    .snap-guide {
      position: absolute;
      z-index: 50;
      pointer-events: none;
      border-color: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
    }

    .snap-guide.vertical {
      top: 0;
      bottom: 0;
      left: 50%;
      border-left: 2px dashed #f59e0b;
    }

    .snap-guide.horizontal {
      left: 0;
      right: 0;
      top: 50%;
      border-top: 2px dashed #f59e0b;
    }

    .lower-third-container {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: auto;
      max-width: 92vw;
      max-height: 88vh;
      text-align: center;
      padding: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      overflow: visible !important;
      cursor: grab;
    }

    .line-text {
      display: inline-block !important;
      font-size: 54px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.4;
      white-space: pre-line;
      text-align: center;
      margin: 0 auto;
      max-width: 92vw;
      word-break: break-word;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95);
      will-change: transform, opacity;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    /* TEXT APPEARANCE ANIMATIONS FOR CONTAINER (WITH MOBILE SAFARI WEBKIT COMPATIBILITY) */
    /* HIGH-PERFORMANCE 60FPS GPU ACCELERATED TEXT APPEARANCE ANIMATIONS */
    /* NOTE: In obs.html, animation is applied to the CONTAINER box which uses translate(-50%,-50%) for centering */
    @-webkit-keyframes textAppearSlide {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, calc(-50% + 25px), 0) scale3d(0.96, 0.96, 1);
        transform: translate3d(-50%, calc(-50% + 25px), 0) scale3d(0.96, 0.96, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @keyframes textAppearSlide {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, calc(-50% + 25px), 0) scale3d(0.96, 0.96, 1);
        transform: translate3d(-50%, calc(-50% + 25px), 0) scale3d(0.96, 0.96, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @-webkit-keyframes textAppearDrop {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, calc(-50% - 25px), 0) scale3d(0.96, 0.96, 1);
        transform: translate3d(-50%, calc(-50% - 25px), 0) scale3d(0.96, 0.96, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @keyframes textAppearDrop {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, calc(-50% - 25px), 0) scale3d(0.96, 0.96, 1);
        transform: translate3d(-50%, calc(-50% - 25px), 0) scale3d(0.96, 0.96, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @-webkit-keyframes textAppearPop {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(0.85, 0.85, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(0.85, 0.85, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @keyframes textAppearPop {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(0.85, 0.85, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(0.85, 0.85, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @-webkit-keyframes textAppearFlip {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(-45deg);
        transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(-45deg);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(0deg);
        transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(0deg);
      }
    }

    @keyframes textAppearFlip {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(-45deg);
        transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(-45deg);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(0deg);
        transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(0deg);
      }
    }

    @-webkit-keyframes textAppearGlow {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1.06, 1.06, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1.06, 1.06, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @keyframes textAppearGlow {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1.06, 1.06, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1.06, 1.06, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    .animate-appear-slide {
      -webkit-animation: textAppearSlide 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      animation: textAppearSlide 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      will-change: transform, opacity;
    }

    .animate-appear-drop {
      -webkit-animation: textAppearDrop 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      animation: textAppearDrop 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      will-change: transform, opacity;
    }

    .animate-appear-pop {
      -webkit-animation: textAppearPop 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      animation: textAppearPop 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      will-change: transform, opacity;
    }

    .animate-appear-flip {
      -webkit-animation: textAppearFlip 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      animation: textAppearFlip 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      will-change: transform, opacity;
    }

    .animate-appear-glow {
      -webkit-animation: textAppearGlow 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      animation: textAppearGlow 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      will-change: transform, opacity;
    }

    .standby-branding {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center;
      padding: 20px 30px;
    }

    .standby-branding .standby-logo {
      width: 120px;
      height: 120px;
      object-fit: cover;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.22);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      filter: drop-shadow(0 8px 24px rgba(0, 0, 0, 0.6));
    }

    .standby-branding .standby-title {
      font-family: 'Alexandria', sans-serif;
      font-size: 2.4rem;
      font-weight: 800;
      color: #ffffff;
      margin: 0;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.85);
      letter-spacing: 0.5px;
    }

    .brand-accent {
      color: #60a5fa;
      font-weight: 800;
    }

    /* Sleek bottom footer info bar for presenter display */
    .presenter-footer-bar {
      position: fixed;
      bottom: 16px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 999;
      direction: rtl;
      font-family: 'Baloo Bhaijaan 2', 'Alexandria', sans-serif;
    }

    .presenter-scale-badge,
    .presenter-slide-counter {
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: rgba(255, 255, 255, 0.9);
      font-size: 0.82rem;
      font-weight: 600;
      padding: 4px 14px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.4);
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
      letter-spacing: 0.3px;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body data-chroma="transparent">

  <!-- MAGNETIC SNAP GUIDES -->
  <div id="snap-guide-h" class="snap-guide horizontal hidden"></div>
  <div id="snap-guide-v" class="snap-guide vertical hidden"></div>

  <div class="lower-third-container" id="presenter-box">
    <div id="standby-branding" class="standby-branding">
      <img src="logo.png" alt="Sunday School Logo" class="standby-logo">
      <div class="standby-title">Sunday School <span class="brand-accent">Taranim</span></div>
    </div>
    <div class="line-text hidden" id="presenter-text"></div>
  </div>

  <!-- PRESENTATION FOOTER BAR (SCALE & SLIDE COUNTER) -->
  <div id="presenter-footer-bar" class="presenter-footer-bar hidden">
    <div id="presenter-scale-badge" class="presenter-scale-badge hidden">
      <i class="fa-solid fa-music"></i> <span id="scale-text"></span>
    </div>
    <div id="presenter-slide-counter" class="presenter-slide-counter hidden">
      <i class="fa-solid fa-layer-group"></i> <span id="counter-text"></span>
    </div>
  </div>

  <script>
    const box = document.getElementById('presenter-box');
    const textEl = document.getElementById('presenter-text');
    const standbyEl = document.getElementById('standby-branding');
    const guideV = document.getElementById('snap-guide-v');
    const guideH = document.getElementById('snap-guide-h');

    let stateFontSize = 54;
    let lastDragTime = 0;

    function requestAutoFullscreen() {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }

    window.addEventListener('load', () => { setTimeout(requestAutoFullscreen, 100); });
    window.addEventListener('click', requestAutoFullscreen);
    window.addEventListener('touchstart', requestAutoFullscreen);
    window.addEventListener('pointerdown', requestAutoFullscreen);
    window.addEventListener('focus', requestAutoFullscreen);
    window.addEventListener('keydown', requestAutoFullscreen);

    const urlParams = new URLSearchParams(window.location.search);
    const paramChroma = urlParams.get('chroma');
    if (paramChroma) {
      document.body.setAttribute('data-chroma', paramChroma);
    }

    const screenLeft = urlParams.get('screenLeft');
    const screenTop = urlParams.get('screenTop');
    const screenIdx = urlParams.get('screenIdx');
    const isAutoFS = urlParams.get('autofs') === 'true';

    // MAXIMIZE WINDOW TO FILL TARGET SCREEN (works without user gesture on refresh)
    function maximizeToScreen() {
      try {
        const sLeft = screenLeft !== null ? parseInt(screenLeft) : (window.screen.availLeft || 0);
        const sTop = screenTop !== null ? parseInt(screenTop) : (window.screen.availTop || 0);
        const sWidth = window.screen.availWidth || window.screen.width || 1920;
        const sHeight = window.screen.availHeight || window.screen.height || 1080;
        window.moveTo(sLeft, sTop);
        window.resizeTo(sWidth, sHeight);
      } catch(e) {}
    }

    // Run immediately
    maximizeToScreen();

    // Also try after a short delay (some browsers need this)
    setTimeout(maximizeToScreen, 100);
    setTimeout(maximizeToScreen, 500);

    if (isAutoFS) {
      window.addEventListener('load', () => {
        // Re-maximize on load
        maximizeToScreen();

        setTimeout(async () => {
          // Try Fullscreen API (will succeed only if user gesture context exists)
          if ('getScreenDetails' in window && screenIdx !== null && screenIdx !== '-1') {
            try {
              const details = await window.getScreenDetails();
              const idx = parseInt(screenIdx);
              if (details && details.screens && details.screens[idx]) {
                const targetScreen = details.screens[idx];
                if (document.documentElement.requestFullscreen) {
                  await document.documentElement.requestFullscreen({ screen: targetScreen });
                  return;
                }
              }
            } catch (err) {}
          }
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
        }, 300);
      });
    }

    const savedPivotRaw = localStorage.getItem('sunday_school_taranim_drag_pivot');
    let currentPivot = { xPct: 50, yPct: 50 };
    if (savedPivotRaw) {
      try {
        const parsed = JSON.parse(savedPivotRaw);
        if (parsed && parsed.xPct !== undefined && parsed.yPct !== undefined) {
          if (parsed.yPct === 75) parsed.yPct = 50;
          currentPivot = parsed;
        } else if (parsed && parsed.left !== undefined) {
          currentPivot.xPct = (parsed.left / window.innerWidth) * 100;
          currentPivot.yPct = (parsed.top / window.innerHeight) * 100;
        }
      } catch(e) {}
    }

    box.style.left = currentPivot.xPct + '%';
    box.style.top = currentPivot.yPct + '%';
    box.style.transform = 'translate3d(-50%, -50%, 0)';

    function requestFS() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }

    // AGGRESSIVE AUTO-FULLSCREEN: try on load, focus, visibility, and via parent BroadcastChannel
    if (urlParams.get('autofs') === 'true') {
      // Try immediately
      requestFS();

      // Retry at multiple intervals
      [100, 300, 600, 1200, 2500].forEach(delay => {
        setTimeout(requestFS, delay);
      });

      // Try on focus (when user switches to this window)
      window.addEventListener('focus', requestFS);

      // Try when page becomes visible
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') requestFS();
      });
    }

    // Listen for parent window to explicitly request fullscreen via BroadcastChannel
    try {
      const fsChannel = new BroadcastChannel('sunday_school_taranim_fs');
      fsChannel.onmessage = (evt) => {
        if (evt.data && evt.data.action === 'REQUEST_FULLSCREEN') {
          requestFS();
        }
      };
    } catch(e) {}

    document.body.addEventListener('click', () => {
      if (!isDragging) {
        requestFS();
        try { channel.postMessage({ action: 'NEXT_SLIDE' }); } catch(e) {}
      }
    });

    // TOUCH SWIPE GESTURE SUPPORT FOR SLIDE NAVIGATION
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;
    const SWIPE_THRESHOLD = 50;
    const SWIPE_MAX_TIME = 500;

    document.body.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchStartTime = Date.now();
    }, { passive: true });

    document.body.addEventListener('touchend', (e) => {
      const deltaX = e.changedTouches[0].clientX - touchStartX;
      const deltaY = e.changedTouches[0].clientY - touchStartY;
      const elapsed = Date.now() - touchStartTime;

      if (elapsed > SWIPE_MAX_TIME) return;
      if (Math.abs(deltaX) < SWIPE_THRESHOLD) return;
      if (Math.abs(deltaY) > Math.abs(deltaX)) return; // vertical swipe, ignore

      e.preventDefault();
      if (deltaX < 0) {
        // Swipe left → next slide
        try { channel.postMessage({ action: 'NEXT_SLIDE' }); } catch(err) {}
      } else {
        // Swipe right → previous slide
        try { channel.postMessage({ action: 'PREV_SLIDE' }); } catch(err) {}
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        try { channel.postMessage({ action: 'NEXT_SLIDE' }); } catch(err) {}
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
        e.preventDefault();
        try { channel.postMessage({ action: 'PREV_SLIDE' }); } catch(err) {}
      }
    });

    window.addEventListener('resize', () => {
      fitTextToSafeArea();
    });

    let lastStyleData = {};

    function applyDynamicShadow(newData) {
      if (newData) {
        lastStyleData = { ...lastStyleData, ...newData };
      }
      const data = lastStyleData;
      
      const currentFontSize = parseFloat(textEl.style.fontSize) || data.fontSize || stateFontSize || 54;
      const scale = currentFontSize / 50;

      const strokeWidth = parseInt(data.strokeWidth || 0);
      const strokeColor = data.strokeColor || '#000000';

      const angleDeg = (data && data.shadowAngle !== undefined) ? data.shadowAngle : 90;
      const distPx = (data && data.shadowDistance !== undefined) ? data.shadowDistance : 6;
      const shadowBlur = (data && data.shadowBlur !== undefined) ? data.shadowBlur : 12;
      const shadowColor = (data && data.shadowColor) ? data.shadowColor : '#000000';

      const rad = (angleDeg || 90) * Math.PI / 180;
      const offX = Math.round(distPx * Math.cos(rad));
      const offY = Math.round(distPx * Math.sin(rad));

      let shadowParts = [];
      if (strokeWidth > 0) {
        const s = Math.max(1, Math.round(strokeWidth * scale));
        shadowParts.push(`-${s}px -${s}px 0 ${strokeColor}`);
        shadowParts.push(`${s}px -${s}px 0 ${strokeColor}`);
        shadowParts.push(`-${s}px  ${s}px 0 ${strokeColor}`);
        shadowParts.push(`${s}px  ${s}px 0 ${strokeColor}`);
      }

      shadowParts.push(`${offX}px ${offY}px ${shadowBlur}px ${shadowColor}`);
      textEl.style.textShadow = shadowParts.join(', ');
    }

    function fitTextToSafeArea() {
      if (!textEl) return;
      const text = textEl.textContent || '';
      const len = text.trim().length;

      const viewportW = window.innerWidth;
      const viewportH = window.innerHeight;

      let targetSize = stateFontSize || 54;
      if (len > 0) {
        if (len < 30) targetSize = Math.max(targetSize, Math.round(viewportH * 0.10));
        else if (len < 60) targetSize = Math.max(targetSize, Math.round(viewportH * 0.08));
        else if (len < 100) targetSize = Math.max(targetSize, Math.round(viewportH * 0.065));
      }

      let size = Math.min(targetSize, 96);
      textEl.style.fontSize = size + 'px';

      const maxW = viewportW * 0.92;
      const maxH = viewportH * 0.86;

      while ((textEl.scrollWidth > maxW || textEl.scrollHeight > maxH) && size > 20) {
        size -= 2;
        textEl.style.fontSize = size + 'px';
      }

      applyDynamicShadow();
    }

    window.addEventListener('resize', fitTextToSafeArea);

    // AUTO FULLSCREEN REQUEST ON CLICK, TOUCH, POINTER, KEY, OR FOCUS
    function requestAutoFullscreen() {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }
    window.addEventListener('click', requestAutoFullscreen);
    window.addEventListener('touchstart', requestAutoFullscreen);
    window.addEventListener('pointerdown', requestAutoFullscreen);
    window.addEventListener('focus', requestAutoFullscreen);
    window.addEventListener('keydown', requestAutoFullscreen);

    // DRAGGING LOGIC (ONLY ENABLED IN GREEN SCREEN CHROMA MODE)
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialXPct = 50;
    let initialYPct = 75;
    const SNAP_THRESHOLD = 22;

    box.addEventListener('mousedown', (e) => {
      // ONLY ALLOW DRAGGING IN GREEN SCREEN MODE
      const currentChroma = document.body.getAttribute('data-chroma');
      if (currentChroma !== 'green') return;

      isDragging = true;
      lastDragTime = Date.now();
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      initialXPct = currentPivot.xPct;
      initialYPct = currentPivot.yPct;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      lastDragTime = Date.now();

      const screenW = window.innerWidth;
      const screenH = window.innerHeight;

      const deltaXPixels = e.clientX - dragStartX;
      const deltaYPixels = e.clientY - dragStartY;

      let targetX = (initialXPct / 100 * screenW) + deltaXPixels;
      let targetY = (initialYPct / 100 * screenH) + deltaYPixels;

      let snappedV = false;
      let snappedH = false;

      if (Math.abs(targetX - screenW / 2) < SNAP_THRESHOLD) {
        targetX = screenW / 2;
        snappedV = true;
      }

      if (Math.abs(targetY - screenH / 2) < SNAP_THRESHOLD) {
        targetY = screenH / 2;
        snappedH = true;
      } else if (Math.abs(targetY - (screenH * 0.75)) < SNAP_THRESHOLD) {
        targetY = screenH * 0.75;
        snappedH = true;
      }

      if (snappedV && guideV) guideV.classList.remove('hidden');
      else if (guideV) guideV.classList.add('hidden');

      if (snappedH && guideH) guideH.classList.remove('hidden');
      else if (guideH) guideH.classList.add('hidden');

      currentPivot.xPct = (targetX / screenW) * 100;
      currentPivot.yPct = (targetY / screenH) * 100;

      box.style.left = currentPivot.xPct + '%';
      box.style.top = currentPivot.yPct + '%';
      box.style.transform = 'translate(-50%, -50%)';

      localStorage.setItem('sunday_school_taranim_drag_pivot', JSON.stringify(currentPivot));
      channel.postMessage({ type: 'UPDATE_POS', pos: currentPivot });
    });

    function getApiUrl() {
      const loc = window.location;
      let path = loc.pathname;
      if (path.includes('/public/')) {
        return path.replace(/\/public\/.*$/, '/api.php');
      }
      if (path.endsWith('.html') || path.endsWith('.php')) {
        return path.substring(0, path.lastIndexOf('/') + 1) + 'api.php';
      }
      if (!path.endsWith('/')) path += '/';
      return path + 'api.php';
    }

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        lastDragTime = Date.now();
        if (guideV) guideV.classList.add('hidden');
        if (guideH) guideH.classList.add('hidden');

        // PERSIST NEW DRAG POSITION TO LOCAL STORAGE & SERVER
        const currentLiveRaw = localStorage.getItem('sunday_school_taranim_live_presentation');
        let payload = {};
        if (currentLiveRaw) {
          try { payload = JSON.parse(currentLiveRaw); } catch(err) {}
        }
        payload.pos = currentPivot;
        payload.updatedAt = Date.now();
        localStorage.setItem('sunday_school_taranim_live_presentation', JSON.stringify(payload));
        localStorage.setItem('sunday_school_taranim_drag_pivot', JSON.stringify(currentPivot));

        const postBody = JSON.stringify(payload);
        const headers = { 'Content-Type': 'application/json' };
        const mainUrl = getApiUrl() + '?action=live';

        fetch(mainUrl, { method: 'POST', headers, body: postBody }).catch(() => {
          fetch('api.php?action=live', { method: 'POST', headers, body: postBody }).catch(() => {
            fetch('../api.php?action=live', { method: 'POST', headers, body: postBody }).catch(() => {});
          });
        });
      }
    });

    let currentTextState = null;
    let currentIsBlankState = null;
    let currentAnimState = null;
    let lastProcessedTimestamp = 0;

    function applyState(data, source = 'local') {
      if (!data || typeof data !== 'object') return;

      // TIMESTAMP DEDUPLICATION: Ignore stale server payloads if a newer local message was already rendered
      if (data.updatedAt && source === 'server') {
        if (data.updatedAt < lastProcessedTimestamp) {
          return;
        }
        lastProcessedTimestamp = data.updatedAt;
      }

      // PREVENT OVERWRITES WHILE USER IS DRAGGING OR RECENTLY DRAGGED (1200ms is enough)
      if (isDragging || (Date.now() - lastDragTime < 1200)) {
        return;
      }

      if (data.status && !data.type && data.text === undefined) return;

      if (data.chroma && !paramChroma) {
        document.body.setAttribute('data-chroma', data.chroma);
      }

      const animType = data.anim || 'slide';

      if (data.font) {
        textEl.style.fontFamily = data.font;
      }

      if (data.fontSize) {
        stateFontSize = data.fontSize;
      }

      if (data.fontWeight) textEl.style.fontWeight = data.fontWeight;
      if (data.fontStyle) textEl.style.fontStyle = data.fontStyle === 'bold' ? 'normal' : data.fontStyle;
      if (data.textDecoration) textEl.style.textDecoration = data.textDecoration;
      if (data.textAlign) {
        textEl.style.textAlign = data.textAlign;
        box.style.textAlign = data.textAlign;
      }
      if (data.letterSpacing !== undefined) textEl.style.letterSpacing = `${data.letterSpacing}px`;
      if (data.lineHeight !== undefined) textEl.style.lineHeight = data.lineHeight;

      if (data.boxOpacity !== undefined && data.boxOpacity > 0) {
        const hex = data.boxBgColor || '#000000';
        const r = parseInt(hex.slice(1, 3), 16) || 0;
        const g = parseInt(hex.slice(3, 5), 16) || 0;
        const b = parseInt(hex.slice(5, 7), 16) || 0;
        const alpha = data.boxOpacity / 100;
        box.style.background = `rgba(${r}, ${g}, ${b}, ${alpha})`;
      } else {
        box.style.background = 'transparent';
      }

      if (data.boxRadius !== undefined) box.style.borderRadius = `${data.boxRadius}px`;
      if (data.boxPadding !== undefined) box.style.padding = `${data.boxPadding}px`;

      const textColor = data.textColor || '#ffffff';
      textEl.style.color = textColor;

      applyDynamicShadow(data);

      const hasText = Boolean(data.text && String(data.text).trim() && !data.isBlank);

      if (!hasText) {
        textEl.classList.add('hidden');
        textEl.style.display = 'none';
        if (standbyEl) standbyEl.classList.remove('hidden');
        currentIsBlankState = true;
      } else {
        if (standbyEl) standbyEl.classList.add('hidden');
        textEl.classList.remove('hidden');
        textEl.style.display = 'inline-block';
        textEl.style.visibility = 'visible';
        textEl.textContent = data.text;
        fitTextToSafeArea();

        if (currentTextState !== data.text || currentAnimState !== animType) {
          currentTextState = data.text;
          currentAnimState = animType;

          box.classList.remove('animate-appear-slide', 'animate-appear-drop', 'animate-appear-pop', 'animate-appear-flip', 'animate-appear-glow');
          textEl.classList.remove('animate-appear-slide', 'animate-appear-drop', 'animate-appear-pop', 'animate-appear-flip', 'animate-appear-glow');

          if (animType !== 'none' && data.text) {
            void box.offsetWidth;
            box.classList.add(`animate-appear-${animType}`);
          }
        }
        currentIsBlankState = false;
      }

      // UPDATE FOOTER BAR (SCALE BADGE & SLIDE COUNTER)
      const footerBarEl = document.getElementById('presenter-footer-bar');
      const scaleBadgeEl = document.getElementById('presenter-scale-badge');
      const scaleTextEl = document.getElementById('scale-text');
      const counterBadgeEl = document.getElementById('presenter-slide-counter');
      const counterTextEl = document.getElementById('counter-text');

      if (footerBarEl) {
        let hasFooter = false;
        if (data.scaleText) {
          if (scaleTextEl) scaleTextEl.textContent = `السلم: ${data.scaleText}`;
          if (scaleBadgeEl) scaleBadgeEl.classList.remove('hidden');
          hasFooter = true;
        } else if (scaleBadgeEl) {
          scaleBadgeEl.classList.add('hidden');
        }

        if (data.currentSlide && data.totalSlides) {
          if (counterTextEl) counterTextEl.textContent = `${data.currentSlide} من ${data.totalSlides}`;
          if (counterBadgeEl) counterBadgeEl.classList.remove('hidden');
          hasFooter = true;
        } else if (counterBadgeEl) {
          counterBadgeEl.classList.add('hidden');
        }

        if (hasFooter && !data.isBlank) {
          footerBarEl.classList.remove('hidden');
        } else {
          footerBarEl.classList.add('hidden');
        }
      }

      // POSITIONING LOGIC: Black screen mode is strictly locked at center (50%, 50%). Green screen is adjustable.
      const currentChroma = document.body.getAttribute('data-chroma');
      if (currentChroma !== 'green') {
        currentPivot = { xPct: 50, yPct: 50 };
        box.style.left = '50%';
        box.style.top = '50%';
        box.style.transform = 'translate(-50%, -50%)';
        box.style.cursor = 'default';
      } else if (data.pos && !isDragging) {
        let x = data.pos.xPct;
        let y = data.pos.yPct;

        if (x === undefined && data.pos.left !== undefined) {
          x = (data.pos.left / window.innerWidth) * 100;
        }
        if (y === undefined && data.pos.top !== undefined) {
          y = (data.pos.top / window.innerHeight) * 100;
        }

        if (x !== undefined && y !== undefined && !isNaN(x) && !isNaN(y)) {
          currentPivot = { xPct: x, yPct: y };
          box.style.left = x + '%';
          box.style.top = y + '%';
          box.style.transform = 'translate(-50%, -50%)';
          localStorage.setItem('sunday_school_taranim_drag_pivot', JSON.stringify(currentPivot));
        }
      }
    }

    const channel = new BroadcastChannel('sunday_school_taranim_obs_channel');
    channel.onmessage = (event) => applyState(event.data, 'local');

    window.addEventListener('storage', (e) => {
      if (e.key === 'sunday_school_taranim_live_presentation') {
        try { applyState(JSON.parse(e.newValue), 'local'); } catch(err) {}
      }
    });

    const initialLiveRaw = localStorage.getItem('sunday_school_taranim_live_presentation');
    if (initialLiveRaw) {
      try { applyState(JSON.parse(initialLiveRaw), 'local'); } catch(err) {}
    }

    let isFetching = false;
    let lastFetchStartTime = 0;
    let activeLiveApiUrl = null;

    async function fetchLiveHTTP() {
      // AUTO-HEALING DEADLOCK BREAKER: Reset after 1000ms (was 2500ms)
      if (isFetching && (Date.now() - lastFetchStartTime > 1000)) {
        isFetching = false;
      }
      if (isFetching || isDragging || (Date.now() - lastDragTime < 1200)) return;
      isFetching = true;
      lastFetchStartTime = Date.now();

      // 800ms abort timeout (was 2000ms) — fail fast, retry fast
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 800);
      const ts = Date.now();

      try {
        let url = activeLiveApiUrl || (getApiUrl() + '?action=live');
        url += (url.includes('?') ? '&' : '?') + '_t=' + ts;

        let res = await fetch(url, { cache: 'no-cache', signal: controller.signal });
        if (res.ok) {
          let data = await res.json();
          if (data && (data.type === 'PRESENT_LINE' || data.text !== undefined)) {
            applyState(data, 'http');
          }
        } else {
          activeLiveApiUrl = null;
          fetchFallbackLive(ts);
        }
      } catch (err) {
        if (!activeLiveApiUrl) {
          fetchFallbackLive(ts);
        } else {
          // Cached URL failed — reset and retry with fallback discovery
          activeLiveApiUrl = null;
        }
      } finally {
        clearTimeout(timeoutId);
        isFetching = false;
      }
    }

    async function fetchFallbackLive(ts) {
      // PARALLEL RACE: All fallback URLs fire simultaneously — fastest one wins
      const fallbackUrls = [
        'api.php?action=live',
        '../api.php?action=live',
        '/taranim/api.php?action=live',
        '/api.php?action=live'
      ].map(u => u + (u.includes('?') ? '&' : '?') + '_t=' + ts);

      const raceController = new AbortController();
      const raceTimeout = setTimeout(() => raceController.abort(), 800);

      const promises = fallbackUrls.map(url =>
        fetch(url, { cache: 'no-cache', signal: raceController.signal })
          .then(async res => {
            if (res.ok) {
              const data = await res.json();
              if (data && (data.type === 'PRESENT_LINE' || data.text !== undefined)) {
                return { url: url.replace(/[?&]_t=\d+/, ''), data };
              }
            }
            return null;
          })
          .catch(() => null)
      );

      try {
        // Wait for all, pick the first non-null result
        const results = await Promise.all(promises);
        const winner = results.find(r => r !== null);
        if (winner) {
          raceController.abort(); // Cancel remaining
          activeLiveApiUrl = winner.url;
          applyState(winner.data, 'http');
        }
      } catch(e) {}
      clearTimeout(raceTimeout);
    }

    // ULTRA-FAST WEB WORKER TIMER (30MS TICKS — FASTER THAN DISPLAY REFRESH FOR INSTANT SYNC)
    let workerTimer = null;
    try {
      const workerBlob = new Blob([
        "let t = null; onmessage = function(e) { if (e.data === 'start') { clearInterval(t); t = setInterval(function() { postMessage('tick'); }, 30); } else if (e.data === 'stop') { clearInterval(t); } };"
      ], { type: 'application/javascript' });
      workerTimer = new Worker(URL.createObjectURL(workerBlob));
      workerTimer.onmessage = function() { fetchLiveHTTP(); };
      workerTimer.postMessage('start');
    } catch (e) {
      setInterval(fetchLiveHTTP, 30);
    }

    // IMMEDIATE RE-FETCH ON VISIBILITY OR FOCUS RESTORATION
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') fetchLiveHTTP();
    });
    window.addEventListener('focus', fetchLiveHTTP);
    window.addEventListener('online', fetchLiveHTTP);
    window.addEventListener('pageshow', fetchLiveHTTP);
    fetchLiveHTTP();
  </script>
</body>
</html>
