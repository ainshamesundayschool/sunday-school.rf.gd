    /* STEALTH OBS WINDOW CONTROL TOOLBAR */
    .stealth-bar {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 6px 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .stealth-bar.hidden {
      display: none !important;
    }
    .stealth-bar-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stealth-badge {
      color: #60a5fa;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .stealth-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stealth-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .stealth-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }
    .stealth-btn.stealth-close {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .stealth-btn.stealth-close:hover {
      background: rgba(239, 68, 68, 0.45);
      color: #ffffff;
    }

    body.is-mini-stealth {

    /* MAGNETIC SNAP GUIDES */
    .snap-guide {
      position: absolute;
      z-index: 50;
      pointer-events: none;
      border-color: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
    }

    .snap-guide.vertical {
      top: 0;
      bottom: 0;
      left: 50%;
      border-left: 2px dashed #f59e0b;
    }

    .snap-guide.horizontal {
      left: 0;
      right: 0;
      top: 50%;
      border-top: 2px dashed #f59e0b;
    }

    /* TEXT APPEARANCE ANIMATIONS FOR CONTAINER (WITH MOBILE SAFARI WEBKIT COMPATIBILITY) */
    /* HIGH-PERFORMANCE 60FPS GPU ACCELERATED TEXT APPEARANCE ANIMATIONS */
    /* NOTE: In present.html, animation is applied to the CONTAINER box which uses translate(-50%,-50%) for centering */
    @-webkit-keyframes textAppearSlide {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, calc(-50% + 25px), 0) scale3d(0.96, 0.96, 1);
        transform: translate3d(-50%, calc(-50% + 25px), 0) scale3d(0.96, 0.96, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @keyframes textAppearSlide {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, calc(-50% + 25px), 0) scale3d(0.96, 0.96, 1);
        transform: translate3d(-50%, calc(-50% + 25px), 0) scale3d(0.96, 0.96, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @-webkit-keyframes textAppearDrop {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, calc(-50% - 25px), 0) scale3d(0.96, 0.96, 1);
        transform: translate3d(-50%, calc(-50% - 25px), 0) scale3d(0.96, 0.96, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @keyframes textAppearDrop {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, calc(-50% - 25px), 0) scale3d(0.96, 0.96, 1);
        transform: translate3d(-50%, calc(-50% - 25px), 0) scale3d(0.96, 0.96, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @-webkit-keyframes textAppearPop {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(0.85, 0.85, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(0.85, 0.85, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @keyframes textAppearPop {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(0.85, 0.85, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(0.85, 0.85, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @-webkit-keyframes textAppearFlip {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(-45deg);
        transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(-45deg);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(0deg);
        transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(0deg);
      }
    }

    @keyframes textAppearFlip {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(-45deg);
        transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(-45deg);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(0deg);
        transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(0deg);
      }
    }

    @-webkit-keyframes textAppearGlow {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1.06, 1.06, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1.06, 1.06, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @keyframes textAppearGlow {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1.06, 1.06, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1.06, 1.06, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    .animate-appear-slide {
      -webkit-animation: textAppearSlide 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      animation: textAppearSlide 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      will-change: transform, opacity;
    }

    .animate-appear-drop {
      -webkit-animation: textAppearDrop 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;

      will-change: transform, opacity;

    .animate-appear-pop {

      animation: textAppearPop 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      will-change: transform, opacity;
    }

    .animate-appear-flip {
      -webkit-animation: textAppearFlip 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      animation: textAppearFlip 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;

    .animate-appear-glow {

      animation: textAppearGlow 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;

    /* LIVE SLIDE LINE HIGHLIGHT STYLES FOR PRESENTER WINDOW */
    .obs-line-row {
      display: block;
      width: 100%;
      text-align: center;
      margin: 0.12em 0;
    }

    .obs-line-segment {
      position: relative;
      display: inline-block !important;
      width: auto !important;
      max-width: 100%;
      transition: color 0.25s ease;
    }

    .obs-line-segment.line-highlighted {
      position: relative;
      z-index: 5;
      color: #ffffff !important;
      text-shadow: none !important;
      transform: none !important;
      font-size: inherit !important;
      font-weight: inherit !important;
    }

    .obs-line-segment.line-highlighted::before {
      content: '';
      position: absolute;
      top: 15%;
      bottom: 8%;
      left: -6px;
      right: -6px;
      background: var(--highlight-bg, rgba(245, 158, 11, 0.82));
      border-radius: 4px;
      z-index: -1;
      box-shadow: none !important;
      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      opacity: 1;
    }

    .obs-line-segment.line-animating::before {
      animation: highlightLinearWipe 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: clip-path, opacity;
    }

    @keyframes highlightLinearWipe {
      0% {
        clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
        opacity: 0;
      }
      100% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        opacity: 1;
      }
    }

    .obs-line-segment.line-unhighlighting::before {
      animation: highlightFadeOut 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes highlightFadeOut {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    .hidden { display: none !important; }

<body data-chroma="black">

  <!-- STEALTH OBS WINDOW CONTROL TOOLBAR -->
  <div id="stealth-control-bar" class="stealth-bar hidden">
    <div class="stealth-bar-content">
      <span class="stealth-badge"><i class="fa-solid fa-ghost"></i> نافذة OBS الخفية (0ms)</span>
      <div class="stealth-actions">
        <button type="button" id="btn-toggle-mini-stealth" class="stealth-btn" title="تصغير النافذة لشاشة مصغرة خفية">
          <i class="fa-solid fa-compress"></i> <span id="mini-stealth-txt">تصغير خفي</span>
        </button>
        <button type="button" id="btn-toggle-stealth-chroma" class="stealth-btn" title="تغيير الخلفية الشفافة / الخضراء">
          <i class="fa-solid fa-palette"></i> <span>الخلفية</span>
        </button>
        <button type="button" id="btn-hide-stealth-bar" class="stealth-btn stealth-close" title="إخفاء هذا الشريط (اضغط S لإظهاره/إخفائه)">
          <i class="fa-solid fa-eye-slash"></i> <span>إخفاء الشريط (S)</span>
        </button>
      </div>
    </div>
  </div>

  <!-- TOP-LEFT BIBLE / CHAPTER REFERENCE HEADER -->
  <div id="obs-top-left-header" class="obs-top-left-header hidden"></div>

  <!-- MAGNETIC SNAP GUIDES -->
  <div id="snap-guide-h" class="snap-guide horizontal hidden"></div>
  <div id="snap-guide-v" class="snap-guide vertical hidden"></div>

  <div class="lower-third-container" id="presenter-box">
    <div id="standby-branding" class="standby-branding">
      <img src="logo_tw.png" alt="Sunday School Logo" class="standby-logo">
    </div>
    <div class="line-text hidden" id="presenter-text"></div>
  </div>

  <!-- PRESENTATION FOOTER BAR (SLIDE COUNTER) -->
  <div id="presenter-footer-bar" class="presenter-footer-bar hidden">
    <div id="presenter-slide-counter" class="presenter-slide-counter hidden">
      <span id="counter-text"></span>
    </div>
  </div>

  <!-- SLEEK ICON EXIT BUTTON AT LEFT END -->
  <button id="btn-close-window-bottom" class="btn-close-overlay-left" onclick="closePresentationWindow(event)" title="إغلاق النافذة (Esc)">
    <i class="fa-solid fa-xmark"></i>
  </button>

  <script>
    const obsChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('sunday_school_taranim_obs_channel') : null;

    const returnFocusToControlPanel = () => {
      try {
        if (obsChannel) {
          obsChannel.postMessage({ type: 'FOCUS_CONTROL_PANEL' });
        }
      } catch (err) {}
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.focus();
        }
      } catch (err) {}
    };

    function updateFullscreenBtnIcon() {
      const btn = document.getElementById('btn-close-window-bottom');
      if (!btn) return;
      const isFS = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      if (isFS) {
        btn.innerHTML = `<i class="fa-solid fa-xmark"></i>`;
        btn.title = 'إنهاء ملء الشاشة (Esc)';
      } else {
        btn.innerHTML = `<i class="fa-solid fa-expand"></i>`;
        btn.title = 'ملء الشاشة';
      }
    }

    document.addEventListener('fullscreenchange', updateFullscreenBtnIcon);
    document.addEventListener('webkitfullscreenchange', updateFullscreenBtnIcon);
    document.addEventListener('DOMContentLoaded', updateFullscreenBtnIcon);

    function closePresentationWindow(e) {
      if (e) {
        if (typeof e.preventDefault === 'function') e.preventDefault();
        if (typeof e.stopPropagation === 'function') e.stopPropagation();
      }

      const isFS = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      if (!isFS) {
        // Not in fullscreen -> enter fullscreen
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } else {
        // In fullscreen -> exit fullscreen
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          try { document.webkitExitFullscreen(); } catch(err) {}
        }
      }
      setTimeout(updateFullscreenBtnIcon, 150);
      returnFocusToControlPanel();
    }
    const box = document.getElementById('presenter-box');
    const textEl = document.getElementById('presenter-text');
    const standbyEl = document.getElementById('standby-branding');
    const guideV = document.getElementById('snap-guide-v');
    const guideH = document.getElementById('snap-guide-h');

    let stateFontSize = 54;
    let lastDragTime = 0;

    function requestAutoFullscreen() {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      returnFocusToControlPanel();
    }

    window.addEventListener('click', () => {
      requestAutoFullscreen();
      returnFocusToControlPanel();
    });
    window.addEventListener('touchstart', requestAutoFullscreen);
    window.addEventListener('pointerdown', requestAutoFullscreen);
    
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.key === ' ' || e.keyCode === 32) {
        e.preventDefault();
        requestAutoFullscreen();
        returnFocusToControlPanel();
      }
    });

    document.addEventListener('fullscreenchange', () => {
      returnFocusToControlPanel();
    });

    const urlParams = new URLSearchParams(window.location.search);
    let initialChroma = urlParams.get('chroma');
    if (!initialChroma) {
      try {
        const savedLiveRaw = localStorage.getItem('sunday_school_taranim_live_presentation');
        if (savedLiveRaw) {
          const parsed = JSON.parse(savedLiveRaw);
          if (parsed && (parsed.chroma || parsed.chromaKey)) {
            initialChroma = parsed.chroma || parsed.chromaKey;
          }
        }
        if (!initialChroma) {
          const savedStyleRaw = localStorage.getItem('sunday_school_taranim_style_settings');
          if (savedStyleRaw) {
            const parsedStyle = JSON.parse(savedStyleRaw);
            if (parsedStyle && parsedStyle.chromaKey) {
              initialChroma = parsedStyle.chromaKey;
            }
          }
        }
      } catch(e) {}
    }
    if (!initialChroma) {
      initialChroma = 'black';
    }
    document.body.setAttribute('data-chroma', initialChroma);

    const screenLeft = urlParams.get('screenLeft');
    const screenTop = urlParams.get('screenTop');
    const screenIdx = urlParams.get('screenIdx');
    const isAutoFS = urlParams.get('autofs') === 'true';

    // MAXIMIZE WINDOW TO FILL TARGET SCREEN (works without user gesture on refresh)
    function maximizeToScreen() {
      try {
        const sLeft = screenLeft !== null ? parseInt(screenLeft) : (window.screen.availLeft || 0);
        const sTop = screenTop !== null ? parseInt(screenTop) : (window.screen.availTop || 0);
        const sWidth = window.screen.availWidth || window.screen.width || 1920;
        const sHeight = window.screen.availHeight || window.screen.height || 1080;
        window.moveTo(sLeft, sTop);
        window.resizeTo(sWidth, sHeight);
      } catch(e) {}
    }

    // Run immediately
    maximizeToScreen();

    // Also try after a short delay (some browsers need this)
    setTimeout(maximizeToScreen, 100);
    setTimeout(maximizeToScreen, 500);

    if (isAutoFS) {
      window.addEventListener('click', () => window.triggerFullscreen(), { once: true });
      window.addEventListener('keydown', () => window.triggerFullscreen(), { once: true });

      window.addEventListener('load', () => {
        maximizeToScreen();

        setTimeout(async () => {
          if ('getScreenDetails' in window && screenIdx !== null && screenIdx !== '-1') {
            try {
              const details = await window.getScreenDetails();
              const idx = parseInt(screenIdx);
              if (details && details.screens && details.screens[idx]) {
                const targetScreen = details.screens[idx];
                if (document.documentElement.requestFullscreen) {
                  await document.documentElement.requestFullscreen({ screen: targetScreen });
                  return;
                }
              }
            } catch (err) {}
          }
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
        }, 300);
      });
    }

    const savedPivotRaw = localStorage.getItem('sunday_school_taranim_drag_pivot');
    let currentPivot = { xPct: 50, yPct: 50 };
    if (savedPivotRaw) {
      try {
        const parsed = JSON.parse(savedPivotRaw);
        if (parsed && parsed.xPct !== undefined && parsed.yPct !== undefined) {
          if (parsed.yPct === 75) parsed.yPct = 50;
          currentPivot = parsed;
        } else if (parsed && parsed.left !== undefined) {
          currentPivot.xPct = (parsed.left / window.innerWidth) * 100;
          currentPivot.yPct = (parsed.top / window.innerHeight) * 100;
        }
      } catch(e) {}
    }

    box.style.left = currentPivot.xPct + '%';
    box.style.top = currentPivot.yPct + '%';
    box.style.transform = 'translate3d(-50%, -50%, 0)';

    window.triggerFullscreen = function() {
      if (!document.fullscreenElement) {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen().catch(() => {});
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }
      }
    };

    const channel = new BroadcastChannel('sunday_school_taranim_obs_channel');

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        try {
          if (channel) channel.postMessage({ action: 'EXTERNAL_FULLSCREEN_ACTIVATED' });
        } catch(err) {}
      }
    });

    function triggerNextSlide() {
      requestFS();
      try {
        if (channel) channel.postMessage({ action: 'NEXT_SLIDE' });
      } catch(err) {}
    }

    // AUTO-POSITION ON EXTERNAL DISPLAY IF COORDINATES ARE PASSED IN QUERY PARAMS
    (function positionOnTargetScreen() {
      try {
        const params = new URLSearchParams(window.location.search);
        const sLeft = parseInt(params.get('screenLeft'));
        const sTop = parseInt(params.get('screenTop'));
        const sWidth = parseInt(params.get('screenWidth'));
        const sHeight = parseInt(params.get('screenHeight'));
        if (!isNaN(sLeft) && !isNaN(sTop)) {
          window.moveTo(sLeft, sTop);
          if (!isNaN(sWidth) && !isNaN(sHeight)) {
            window.resizeTo(sWidth, sHeight);
          }
        }
      } catch(e) {}
    })();

    function triggerPrevSlide() {
      requestFS();
      try {
        if (channel) channel.postMessage({ action: 'PREV_SLIDE' });
      } catch(err) {}
    }

    let lastTouchTime = 0;

    window.addEventListener('click', (e) => {
      if (e.target && e.target.closest && e.target.closest('#btn-close-window-bottom, .btn-close-overlay-left, button, a')) return;
      if (Date.now() - lastTouchTime < 500) return;
      const currentChroma = document.body.getAttribute('data-chroma');
      if (currentChroma === 'green' && isDragging) return;
      triggerNextSlide();
    });

    // TOUCH SWIPE & TAP GESTURE SUPPORT FOR SLIDE NAVIGATION
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    window.addEventListener('touchstart', (e) => {
      if (e.target && e.target.closest && e.target.closest('#btn-close-window-bottom, .btn-close-overlay-left, button, a')) return;
      if (e.touches && e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = Date.now();
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.target && e.target.closest && e.target.closest('#btn-close-window-bottom, .btn-close-overlay-left, button, a')) return;
      if (!e.changedTouches || e.changedTouches.length === 0) return;
      const currentChroma = document.body.getAttribute('data-chroma');
      if (currentChroma === 'green' && isDragging) return;

      lastTouchTime = Date.now();

      const deltaX = e.changedTouches[0].clientX - touchStartX;
      const deltaY = e.changedTouches[0].clientY - touchStartY;
      const elapsed = Date.now() - touchStartTime;

      if (elapsed > 700) return;

      // Small touch movement (< 15px) = Tap / Click → Next slide
      if (Math.abs(deltaX) < 15 && Math.abs(deltaY) < 15) {
        triggerNextSlide();
        return;
      }

      // Horizontal swipe (Right-to-Left deltaX < 0 = Next slide)
      if (Math.abs(deltaX) >= 25 && Math.abs(deltaX) > Math.abs(deltaY)) {
        if (deltaX < 0) {
          triggerNextSlide();
        } else {
          triggerPrevSlide();
        }
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        triggerNextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
        e.preventDefault();
        triggerPrevSlide();
      }
    });

    window.addEventListener('resize', () => {
      fitTextToSafeArea();
    });

    let lastStyleData = {};

    function applyDynamicShadow(newData) {
      if (newData) {
        lastStyleData = { ...lastStyleData, ...newData };
      }
      const data = lastStyleData;
      
      const currentFontSize = parseFloat(textEl.style.fontSize) || data.fontSize || stateFontSize || 54;
      const scale = currentFontSize / 54;

      const strokeWidth = parseInt(data.strokeWidth || 0);
      const strokeColor = data.strokeColor || '#000000';

      const angleDeg = (data && data.shadowAngle !== undefined) ? data.shadowAngle : 142;
      const baseDistPx = (data && data.shadowDistance !== undefined) ? data.shadowDistance : 13;
      const baseShadowBlur = (data && data.shadowBlur !== undefined) ? data.shadowBlur : 18;
      const shadowColor = (data && data.shadowColor) ? data.shadowColor : '#000000';

      const scaledStrokeWidth = strokeWidth > 0 ? Math.max(1, Math.round(strokeWidth * scale)) : 0;
      const scaledDistPx = Math.round(baseDistPx * scale);
      const scaledShadowBlur = Math.round(baseShadowBlur * scale);

      const rad = (angleDeg || 142) * Math.PI / 180;
      const offX = Math.round(scaledDistPx * Math.cos(rad));
      const offY = Math.round(scaledDistPx * Math.sin(rad));

      textEl.style.paintOrder = 'stroke fill markers';
      textEl.style.webkitPaintOrder = 'stroke fill markers';

      let shadowParts = [];
      if (scaledStrokeWidth > 0) {
        textEl.style.webkitTextStroke = `${scaledStrokeWidth}px ${strokeColor}`;
        textEl.style.textStroke = `${scaledStrokeWidth}px ${strokeColor}`;
        
        for (let angle = 0; angle < 360; angle += 22.5) {
          const rA = angle * Math.PI / 180;
          const sx = (scaledStrokeWidth * Math.cos(rA)).toFixed(1);
          const sy = (scaledStrokeWidth * Math.sin(rA)).toFixed(1);
          shadowParts.push(`${sx}px ${sy}px 0 ${strokeColor}`);
        }
      } else {
        textEl.style.webkitTextStroke = '0px transparent';
        textEl.style.textStroke = '0px transparent';
      }

      if (scaledShadowBlur > 0 || scaledDistPx > 0) {
        shadowParts.push(`${offX}px ${offY}px ${scaledShadowBlur}px ${shadowColor}`);
      }
      textEl.style.textShadow = shadowParts.length > 0 ? shadowParts.join(', ') : 'none';
    }

    let currentIsBible = false;
    let _uniformFontSize = null;
    let _uniformSongKey = '';
    let _lastAnimSlideText = '';

    // Compute the optimal font size for a given HTML string rendered in textEl
    function _computeOptimalSize(htmlContent, maxW, maxH, isJomhuria, segCountHint) {
      const isVertical = window.innerHeight > window.innerWidth;
      const refTargetW = isVertical ? Math.max(maxW, maxH * (16 / 9)) : maxW;

      const origHTML = textEl.innerHTML;
      const origDisplay = textEl.style.display;
      const origVis = textEl.style.visibility;

      textEl.innerHTML = htmlContent;
      textEl.style.display = 'inline-block';
      textEl.style.visibility = 'hidden';

      const segments = textEl.querySelectorAll('.obs-line-segment');
      const segCount = segments.length || segCountHint || 1;

      segments.forEach(s => {
        s.style.display = 'inline-block';
        s.style.width = 'auto';
        s.style.whiteSpace = 'nowrap';
        s.style.wordBreak = 'keep-all';
        s.style.overflowWrap = 'normal';
      });

      let minFloor = isJomhuria ? 56 : 44;
      let low = minFloor;
      let maxLimit = isJomhuria ? 300 : 260;
      let high = Math.min(maxLimit, Math.max(120, Math.floor(maxH / Math.max(1, segCount * 0.85))));
      let renderSize = minFloor;

      textEl.style.whiteSpace = 'nowrap';
      textEl.style.maxWidth = 'none';

      while (low <= high) {
        const mid = Math.floor((low + high) / 2);
        textEl.style.fontSize = `${mid}px`;
        const h = textEl.scrollHeight || textEl.offsetHeight;
        const w = textEl.scrollWidth || textEl.offsetWidth;

        if (h <= maxH && w <= refTargetW) {
          renderSize = mid;
          low = mid + 1;
        } else {
          high = mid - 1;
        }
      }

      renderSize = Math.max(minFloor, renderSize);
      textEl.style.fontSize = `${renderSize}px`;

      textEl.innerHTML = origHTML;
      textEl.style.display = origDisplay;
      textEl.style.visibility = origVis;

      return renderSize;
    }

    let _cachedUniformKey = '';
    let _cachedUniformSize = null;

    function _computeUniformFontSize(allSlideTexts, isBible, maxW, maxH, isJomhuria) {
      const minFloor = isJomhuria ? 56 : 44;
      if (!allSlideTexts || !Array.isArray(allSlideTexts) || allSlideTexts.length === 0) return minFloor;
      const key = `${allSlideTexts.length}_${allSlideTexts[0] || ''}_${isBible}_${Math.round(maxW)}_${Math.round(maxH)}_${isJomhuria}`;
      if (_cachedUniformKey === key && _cachedUniformSize !== null) {
        return _cachedUniformSize;
      }

      let minSize = Infinity;
      const slidesToEvaluate = allSlideTexts.length <= 6 ? allSlideTexts : [
        allSlideTexts[0],
        allSlideTexts[Math.floor(allSlideTexts.length / 4)],
        allSlideTexts[Math.floor(allSlideTexts.length / 2)],
        allSlideTexts[Math.floor((3 * allSlideTexts.length) / 4)],
        allSlideTexts[allSlideTexts.length - 1]
      ];

      for (const slideText of slidesToEvaluate) {
        if (!slideText || !slideText.trim()) continue;
        const html = formatPresenterText(slideText, isBible, '', '');
        const size = _computeOptimalSize(html, maxW, maxH, isJomhuria, 1);
        if (size < minSize) minSize = size;
      }

      _cachedUniformKey = key;
      _cachedUniformSize = (minSize === Infinity || minSize < minFloor) ? minFloor : minSize;
      return _cachedUniformSize;
    }

    function fitTextToSafeArea(isBible = currentIsBible) {
      if (!textEl) return;
      currentIsBible = isBible;
      let baseSize = (lastStyleData && lastStyleData.fontSize) || stateFontSize || 54;
      const scaleMode = (lastStyleData && lastStyleData.scaleMode) || 'auto';
      const container = document.getElementById('obs-overlay-container') || document.body;
      const maxH = (container.clientHeight || window.innerHeight) * 0.88;
      const maxW = (container.clientWidth || window.innerWidth) * 0.92;

      const segments = Array.from(textEl.querySelectorAll('.obs-line-segment'));
      const currentFont = (lastStyleData && lastStyleData.font) || textEl.style.fontFamily || '';
      const isJomhuria = /jomhuria/i.test(currentFont);

      const align = (lastStyleData && lastStyleData.textAlign) || textEl.style.textAlign || 'center';
      const lSpacing = (lastStyleData && lastStyleData.letterSpacing !== undefined) ? lastStyleData.letterSpacing : 0;
      const lHeight = (lastStyleData && lastStyleData.lineHeight !== undefined) ? lastStyleData.lineHeight : 1.5;
      const fWeight = (lastStyleData && lastStyleData.fontWeight) || '400';
      const fStyle = (lastStyleData && lastStyleData.fontStyle) || 'normal';
      const tDeco = (lastStyleData && lastStyleData.textDecoration) || 'none';

      if (align === 'justify' && !isJomhuria) {
        textEl.style.textAlign = 'justify';
        textEl.style.textJustify = 'kashida';
        textEl.style.textAlignLast = 'justify';
      } else {
        textEl.style.textAlign = align === 'justify' ? 'center' : align;
        textEl.style.textJustify = 'auto';
        textEl.style.textAlignLast = align === 'justify' ? 'center' : align;
      }
      textEl.style.fontStyle = fStyle;
      textEl.style.textDecoration = tDeco;

      segments.forEach(s => {
        s.style.display = 'inline-block';
        s.style.width = 'auto';
        s.style.whiteSpace = 'pre-wrap';
        s.style.wordBreak = 'break-word';
        s.style.overflowWrap = 'break-word';
        s.style.textAlign = align;
      });

      // Apply Font & Typography Metrics BEFORE Binary Search so measurements reflect real font bounds
      const finalLineHeight = lHeight !== undefined ? lHeight : 1.5;
      textEl.style.lineHeight = `${finalLineHeight}`;
      const lineRows = textEl.querySelectorAll('.obs-line-row');
      lineRows.forEach(r => {
        r.style.lineHeight = `${finalLineHeight}`;
        r.style.marginBottom = `${Math.round((finalLineHeight - 1) * 14)}px`;
      });

      if (isJomhuria) {
        textEl.style.fontFamily = 'Jomhuria, Arial, sans-serif';
        textEl.style.letterSpacing = `${lSpacing || 2}px`;
        textEl.style.wordSpacing = '6px';
        textEl.style.fontWeight = '400';
      } else {
        textEl.style.fontFamily = currentFont || 'sans-serif';
        textEl.style.letterSpacing = `${lSpacing}px`;
        textEl.style.wordSpacing = 'normal';
        textEl.style.fontWeight = fWeight;
      }

      let renderSize = baseSize;

      if (scaleMode === 'fixed') {
        renderSize = baseSize;
        textEl.style.fontSize = `${renderSize}px`;
        const fixedLH = (lastStyleData && lastStyleData.lineHeight !== undefined) ? lastStyleData.lineHeight : 1.5;
        textEl.style.lineHeight = `${fixedLH}`;
      } else if (scaleMode === 'auto') {
        const segmentsCount = segments ? segments.length : 1;
        let defaultLH = 1.18;
        if (isJomhuria) {
          defaultLH = 0.92;
        } else if (segmentsCount > 2) {
          defaultLH = 1.18;
        } else if (segmentsCount === 1) {
          defaultLH = 1.15;
        }
        const autoLineHeight = (lastStyleData && lastStyleData.lineHeight !== undefined) ? lastStyleData.lineHeight : defaultLH;
        textEl.style.lineHeight = `${autoLineHeight}`;

        const curW = container.clientWidth || window.innerWidth || 1920;
        const curH = container.clientHeight || window.innerHeight || 1080;

        // Lock maximum height to 16:9 horizontal format ratio (never fill tall vertical areas)
        const horizontalFormatMaxH = curW * (9 / 16);
        const effectiveCanvasH = Math.min(curH, horizontalFormatMaxH);

        const targetMaxW = curW * 0.94;
        const targetMaxH = effectiveCanvasH * 0.88;

        // Set whiteSpace to nowrap during binary search measurement so lines don't prematurely wrap and artificially collapse font size
        segments.forEach(s => s.style.whiteSpace = 'nowrap');

        let low = 36;
        let high = isJomhuria ? 120 : Math.max(380, Math.floor(effectiveCanvasH * 0.45));
        renderSize = low;

        while (low <= high) {
          const mid = Math.floor((low + high) / 2);
          textEl.style.fontSize = `${mid}px`;
          const h = textEl.scrollHeight || textEl.offsetHeight;
          const w = textEl.scrollWidth || textEl.offsetWidth;

          if (h <= targetMaxH && w <= targetMaxW) {
            renderSize = mid;
            low = mid + 1;
          } else {
            high = mid - 1;
          }
        }

        if (isJomhuria) {
          renderSize = Math.min(120, renderSize);
        }

        // Restore pre-wrap after measurement
        segments.forEach(s => {
          s.style.whiteSpace = 'pre-wrap';
          s.style.wordBreak = 'break-word';
        });

        renderSize = Math.max(28, renderSize);
        textEl.style.fontSize = `${renderSize}px`;
      }

      textEl.style.fontSize = renderSize + 'px';
      textEl.style.transform = 'none';

      applyDynamicShadow();
    }

    window.addEventListener('resize', () => fitTextToSafeArea());

    // AUTO POSITION WINDOW TO TARGET SCREEN IF QUERY PARAMS ARE PRESENT
    (function autoPositionWindow() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('autofs') === 'true') {
        const sLeft = parseInt(params.get('screenLeft'));
        const sTop = parseInt(params.get('screenTop'));
        const sWidth = parseInt(params.get('screenWidth'));
        const sHeight = parseInt(params.get('screenHeight'));

        if (!isNaN(sLeft) && !isNaN(sTop)) {
          try {
            window.moveTo(sLeft, sTop);
            if (!isNaN(sWidth) && !isNaN(sHeight)) {
              window.resizeTo(sWidth, sHeight);
            }
          } catch(e) {}
        }
      }
    })();

    let currentTextState = '';
    let currentAnimState = '';
    let currentIsBlankState = false;

    // AUTO FULLSCREEN ON SECONDARY SCREEN VIA WINDOW MANAGEMENT API
    let _targetScreen = null;
    let _screenDetailsReady = false;

    // Try to get screen details immediately (permission may already be granted)
    (async function detectScreens() {
      if ('getScreenDetails' in window) {
        try {
          const details = await window.getScreenDetails();
          const sIdx = screenIdx !== null ? parseInt(screenIdx) : -1;
          if (details && details.screens && sIdx >= 0 && details.screens[sIdx]) {
            _targetScreen = details.screens[sIdx];
          } else if (details && details.screens && details.screens.length > 1) {
            _targetScreen = details.screens.find(s => !s.isPrimary) || details.screens[1];
          }
          _screenDetailsReady = true;
        } catch(e) { _screenDetailsReady = true; }
      } else {
        _screenDetailsReady = true;
      }
    })();

    async function requestAutoFullscreen(e) {
      if (document.fullscreenElement) return;
      if (e && e.target && e.target.closest && e.target.closest('#btn-close-window-bottom, .btn-close-overlay-left')) return;

      // First interaction: request screen permission if not yet granted
      if (!_screenDetailsReady && 'getScreenDetails' in window) {
        try {
          const details = await window.getScreenDetails();
          const sIdx = screenIdx !== null ? parseInt(screenIdx) : -1;
          if (details && details.screens && sIdx >= 0 && details.screens[sIdx]) {
            _targetScreen = details.screens[sIdx];
          } else if (details && details.screens && details.screens.length > 1) {
            _targetScreen = details.screens.find(s => !s.isPrimary) || details.screens[1];
          }
          _screenDetailsReady = true;
        } catch(e) { _screenDetailsReady = true; }
      }

      // Fullscreen on secondary screen if available, otherwise normal fullscreen
      if (_targetScreen && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen({ screen: _targetScreen }).catch(() => {
          // Fallback to normal fullscreen
          document.documentElement.requestFullscreen().catch(() => {});
        });
      } else if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }
    window.addEventListener('click', requestAutoFullscreen);
    window.addEventListener('touchstart', requestAutoFullscreen);
    window.addEventListener('pointerdown', requestAutoFullscreen);

    // DRAGGING LOGIC (ONLY ENABLED IN GREEN SCREEN CHROMA MODE)
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialXPct = 50;
    let initialYPct = 75;
    const SNAP_THRESHOLD = 22;

    box.addEventListener('mousedown', (e) => {
      // ONLY ALLOW DRAGGING IN GREEN SCREEN MODE
      const currentChroma = document.body.getAttribute('data-chroma');
      if (currentChroma !== 'green') {
        isDragging = false;
        if (guideV) guideV.classList.add('hidden');
        if (guideH) guideH.classList.add('hidden');
        return;
      }

      isDragging = true;
      lastDragTime = Date.now();
      dragStartX = e.clientX;
      dragStartY = e.clientY;
      initialXPct = currentPivot.xPct;
      initialYPct = currentPivot.yPct;
    });

    window.addEventListener('mousemove', (e) => {
      const currentChroma = document.body.getAttribute('data-chroma');
      if (currentChroma !== 'green') {
        isDragging = false;
        if (guideV) guideV.classList.add('hidden');
        if (guideH) guideH.classList.add('hidden');
        return;
      }
      if (!isDragging) return;
      lastDragTime = Date.now();

      const screenW = window.innerWidth;
      const screenH = window.innerHeight;

      const deltaXPixels = e.clientX - dragStartX;
      const deltaYPixels = e.clientY - dragStartY;

      let targetX = (initialXPct / 100 * screenW) + deltaXPixels;
      let targetY = (initialYPct / 100 * screenH) + deltaYPixels;

      let snappedV = false;
      let snappedH = false;

      if (Math.abs(targetX - screenW / 2) < SNAP_THRESHOLD) {
        targetX = screenW / 2;
        snappedV = true;
      }

      if (Math.abs(targetY - screenH / 2) < SNAP_THRESHOLD) {
        targetY = screenH / 2;
        snappedH = true;
      } else if (Math.abs(targetY - (screenH * 0.75)) < SNAP_THRESHOLD) {
        targetY = screenH * 0.75;
        snappedH = true;
      }

      if (snappedV && guideV) guideV.classList.remove('hidden');
      else if (guideV) guideV.classList.add('hidden');

      if (snappedH && guideH) guideH.classList.remove('hidden');
      else if (guideH) guideH.classList.add('hidden');

      currentPivot.xPct = (targetX / screenW) * 100;
      currentPivot.yPct = (targetY / screenH) * 100;

      box.style.left = currentPivot.xPct + '%';
      box.style.top = currentPivot.yPct + '%';
      box.style.transform = 'translate(-50%, -50%)';

      localStorage.setItem('sunday_school_taranim_drag_pivot', JSON.stringify(currentPivot));
      channel.postMessage({ type: 'UPDATE_POS', pos: currentPivot });
    });

    function getApiUrl() {
      const loc = window.location;
      let path = loc.pathname;
      if (path.includes('/public/')) {
        return path.replace(/\/public\/.*$/, '/api.php');
      }
      if (path.endsWith('.html') || path.endsWith('.php')) {
        return path.substring(0, path.lastIndexOf('/') + 1) + 'api.php';
      }
      if (!path.endsWith('/')) path += '/';
      return path + 'api.php';
    }

    window.addEventListener('mouseup', () => {
      if (isDragging) {
        isDragging = false;
        lastDragTime = Date.now();
        if (guideV) guideV.classList.add('hidden');
        if (guideH) guideH.classList.add('hidden');

        // PERSIST NEW DRAG POSITION TO LOCAL STORAGE & SERVER
        const currentLiveRaw = localStorage.getItem('sunday_school_taranim_live_presentation');
        let payload = {};
        if (currentLiveRaw) {
          try { payload = JSON.parse(currentLiveRaw); } catch(err) {}
        }
        payload.pos = currentPivot;
        payload.updatedAt = Date.now();
        localStorage.setItem('sunday_school_taranim_live_presentation', JSON.stringify(payload));
        localStorage.setItem('sunday_school_taranim_drag_pivot', JSON.stringify(currentPivot));

        const postBody = JSON.stringify(payload);
        const headers = { 'Content-Type': 'application/json' };
        const mainUrl = getApiUrl() + '?action=live';

        fetch(mainUrl, { method: 'POST', headers, body: postBody }).catch(() => {
          fetch('api.php?action=live', { method: 'POST', headers, body: postBody }).catch(() => {
            fetch('../api.php?action=live', { method: 'POST', headers, body: postBody }).catch(() => {});
          });
        });
      }
    });

    function formatPresenterText(rawText, isBible = false, badgeTextOverride = '', badgeClassOverride = '') {
      if (!rawText) return '';

      let text = String(rawText);
      if (text.includes('allinone-slide-group') || text.includes('obs-line-row')) {
        return text;
      }
      let detectedBadge = badgeTextOverride || '';
      let detectedBadgeClass = badgeClassOverride || '';

      if (!detectedBadge) {
        const badgeMatch = text.match(/^\s*\(?(ق|قرار|\d+|[٠-٩]+)\)?[:\s\-]*\s*/i);
        if (badgeMatch) {
          const isChorus = /ق|قرار/i.test(badgeMatch[1]);
          detectedBadge = isChorus ? '(ق)' : `(${badgeMatch[1]})`;
          detectedBadgeClass = isChorus ? 'chorus-badge-side chorus-num' : 'stanza-badge-side verse-num';
          text = text.replace(/^\s*\(?(ق|قرار|\d+|[٠-٩]+)\)?[:\s\-]*\s*/i, '').trim();
        }
      } else {
        const isChorus = /ق|قرار/i.test(detectedBadge);
        if (isChorus) {
          detectedBadge = '(ق)';
          detectedBadgeClass = 'chorus-badge-side chorus-num';
        }
        text = text.replace(/^\s*\(?(ق|قرار|\d+|[٠-٩]+)\)?[:\s\-]*\s*/i, '').trim();
      }

      let html = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

      let lines = html.split('\n');

      let badgeHtml = '';
      if (detectedBadge) {
        badgeHtml = `<span class="slide-badge-layer ${detectedBadgeClass}">${detectedBadge}</span>`;
      }

      const isJomhuria = /jomhuria/i.test((lastStyleData && lastStyleData.font) || '');
      let isJustify = isBible || Boolean(lastStyleData && (lastStyleData.isJustified || lastStyleData.textAlign === 'justify')) && !isJomhuria;
      const connectableRegex = /([\u0628\u062A\u062B\u062C\u062D\u062E\u0633\u0634\u0635\u0636\u0637\u0638\u0639\u063A\u0641\u0642\u0643\u0644\u0645\u0646\u0647])(?=[\u0600-\u064A])/g;

      let processedLines = lines.map(l => l.trim()).filter(Boolean);

      if (isJustify && processedLines.length > 0) {
        const getCleanLen = (s) => s.replace(/[\u064B-\u0652]/g, '').length;
        const lineLens = processedLines.map(getCleanLen);
        const maxLen = Math.max(...lineLens);

        processedLines = processedLines.map((lineStr) => {
          if (!/[\u0600-\u06FF]/.test(lineStr)) return lineStr;
          const curLen = getCleanLen(lineStr);
          const diff = maxLen - curLen;

          const slotsMatches = lineStr.match(connectableRegex);
          const slotCount = slotsMatches ? slotsMatches.length : 0;

          if (slotCount === 0) return lineStr;

          let repeats = 1;
          if (diff > 0) {
            repeats = Math.min(4, Math.max(1, Math.round(diff / slotCount) + 1));
          }

          const kashidaStr = 'ـ'.repeat(repeats);
          return lineStr.replace(connectableRegex, `$1${kashidaStr}`);
        });
      }

      let lineSegments = processedLines.map((l, idx) => {
        let lineStr = l;
        if (lineStr.startsWith('(')) {
          lineStr = '<span class="rep-num-grey" style="color:#94a3b8; font-weight:600; margin-left:1px;">(</span>' + lineStr.substring(1);
        }
        lineStr = lineStr.replace(/\)([\d٠-٩]*)$/, '<span class="rep-num-grey" style="color:#94a3b8; font-weight:600; margin-right:1px;">)$1</span>');

        const rowClass = isBible ? 'obs-line-row is-bible-row' : 'obs-line-row';

        if (idx === 0) {
          return `<div class="${rowClass}" style="position:relative;">${badgeHtml}<span class="obs-line-segment obs-first-line" data-line-idx="0">${lineStr}</span></div>`;
        }
        return `<div class="${rowClass}"><span class="obs-line-segment" data-line-idx="${idx}">${lineStr}</span></div>`;
      }).filter(Boolean).join('');

      const wrapperClass = isBible ? 'obs-lines-wrapper is-bible-lines' : 'obs-lines-wrapper';
      return `<div class="obs-slide-wrapper" style="overflow: visible;"><div class="${wrapperClass}" style="overflow: visible;">${lineSegments}</div></div>`;
    }

    function applyState(data, source = 'local') {
      if (!data || typeof data !== 'object') return;

      // TIMESTAMP DEDUPLICATION: Ignore stale server/HTTP payloads if a newer local message was already rendered
      if (data.updatedAt && (source === 'server' || source === 'http')) {
        if (data.updatedAt < lastProcessedTimestamp) {
          return;
        }
      }
      if (data.updatedAt) {
        lastProcessedTimestamp = data.updatedAt;
      }

      const textEl = document.getElementById('presenter-text');
      const box = document.getElementById('presenter-box');
      const standbyEl = document.getElementById('standby-branding');
      const animType = data.anim || 'fade';

      if (!textEl || !box) return;

      if (data.forceRefresh) {
        // Force complete DOM repaint and reset stuck transitions to unfreeze OBS
        box.style.display = 'none';
        void box.offsetHeight;
        box.style.display = '';
        if (textEl) {
          textEl.classList.remove('anim-slide', 'anim-drop', 'anim-pop', 'anim-flip', 'anim-glow');
          void textEl.offsetHeight;
        }
      }

      const incomingChroma = data.chroma || data.chromaKey;
      if (incomingChroma) {
        document.body.setAttribute('data-chroma', incomingChroma);
      }
      const incomingMode = data.mode || data.presentationMode || 'oneline';
      document.body.setAttribute('data-mode', incomingMode);

      const customFontUrl = data.customFontDataUrl || localStorage.getItem('sunday_school_custom_font_dataurl');
      const customFontName = data.customFontName || localStorage.getItem('sunday_school_custom_font_name');
      if (customFontUrl && customFontName) {
        let fontStyleEl = document.getElementById('custom-uploaded-font-style-obs');
        if (!fontStyleEl) {
          fontStyleEl = document.createElement('style');
          fontStyleEl.id = 'custom-uploaded-font-style-obs';
          document.head.appendChild(fontStyleEl);
        }
        fontStyleEl.textContent = `@font-face { font-family: "${customFontName}"; src: url("${customFontUrl}"); }`;
      }

      if (data.font) {
        textEl.style.fontFamily = data.font;
      }

      if (data.fontSize) {
        stateFontSize = data.fontSize;
      }

      if (!lastStyleData) lastStyleData = {};
      if (data.font) lastStyleData.font = data.font;
      if (data.textAlign) lastStyleData.textAlign = data.textAlign;
      if (data.letterSpacing !== undefined) lastStyleData.letterSpacing = data.letterSpacing;
      if (data.lineHeight !== undefined) lastStyleData.lineHeight = data.lineHeight;
      if (data.fontWeight) lastStyleData.fontWeight = data.fontWeight;
      if (data.fontStyle) lastStyleData.fontStyle = data.fontStyle;
      if (data.textDecoration) lastStyleData.textDecoration = data.textDecoration;

      if (data.fontWeight) textEl.style.fontWeight = data.fontWeight;
      if (data.fontStyle) textEl.style.fontStyle = data.fontStyle;
      if (data.textDecoration) textEl.style.textDecoration = data.textDecoration;
      if (data.textAlign) {
        textEl.style.textAlign = data.textAlign;
        box.style.textAlign = data.textAlign;
      }
      if (data.letterSpacing !== undefined) textEl.style.letterSpacing = `${data.letterSpacing}px`;
      if (data.lineHeight !== undefined) textEl.style.lineHeight = data.lineHeight;

      if (data.boxOpacity !== undefined && data.boxOpacity > 0) {
        const hex = data.boxBgColor || '#000000';
        const r = parseInt(hex.slice(1, 3), 16) || 0;
        const g = parseInt(hex.slice(3, 5), 16) || 0;
        const b = parseInt(hex.slice(5, 7), 16) || 0;
        const alpha = data.boxOpacity / 100;
        box.style.background = `rgba(${r}, ${g}, ${b}, ${alpha})`;
      } else {
        box.style.background = 'transparent';
      }

      if (data.boxRadius !== undefined) box.style.borderRadius = `${data.boxRadius}px`;
      if (data.boxPadding !== undefined) box.style.padding = `${data.boxPadding}px`;

      const textColor = data.textColor || '#ffffff';
      textEl.style.color = textColor;

      applyDynamicShadow(data);

      const blankOverlayEl = document.getElementById('blank-screen-overlay');
      if (blankOverlayEl) {
        blankOverlayEl.classList.toggle('hidden', !data.isBlank);
      }

      if (data.hideControls !== undefined) {
        document.body.classList.toggle('controls-hidden', Boolean(data.hideControls));
      }

      const topLeftHeaderEl = document.getElementById('obs-top-left-header');
      if (topLeftHeaderEl) {
        if (data.bibleRef && !data.isBlank) {
          topLeftHeaderEl.textContent = data.bibleRef;
          topLeftHeaderEl.classList.remove('hidden');
        } else {
          topLeftHeaderEl.classList.add('hidden');
        }
      }

      const hasText = Boolean(data.text && String(data.text).trim() && !data.isBlank);

      const logoImg = document.querySelector('.standby-logo');
      if (logoImg && data) {
        const sWidth = data.strokeWidth || 0;
        const sColor = data.strokeColor || '#000000';
        const sBlur = data.shadowBlur || 0;
        const sShadowCol = data.shadowColor || 'rgba(0,0,0,0.85)';
        const sDist = data.shadowDistance !== undefined ? data.shadowDistance : 6;
        const sAngle = data.shadowAngle !== undefined ? data.shadowAngle : 90;

        const filters = [];
        if (sWidth > 0 && sColor) {
          const sw = Math.min(sWidth, 6);
          filters.push(`drop-shadow(${sw}px 0 0 ${sColor})`);
          filters.push(`drop-shadow(-${sw}px 0 0 ${sColor})`);
          filters.push(`drop-shadow(0 ${sw}px 0 ${sColor})`);
          filters.push(`drop-shadow(0 -${sw}px 0 ${sColor})`);
        }
        if (sBlur > 0 || sDist > 0) {
          const angleRad = sAngle * (Math.PI / 180);
          const offX = Math.round(sDist * Math.cos(angleRad));
          const offY = Math.round(sDist * Math.sin(angleRad));
          filters.push(`drop-shadow(${offX}px ${offY}px ${sBlur}px ${sShadowCol})`);
        } else {
          filters.push('drop-shadow(0 8px 24px rgba(0, 0, 0, 0.6))');
        }
        logoImg.style.filter = filters.join(' ');
      }

      const isBlankMode = Boolean(data.isBlank);
      const isLogoSlide = Boolean(data.isLogoSlide);
      const hasTextContent = Boolean(data.text && String(data.text).trim());

      if (isBlankMode) {
        // HIDE BUTTON IS ON: Hide text AND hide logo, keep chosen background intact
        textEl.classList.add('hidden');
        textEl.style.display = 'none';
        if (standbyEl) standbyEl.classList.add('hidden');
        currentIsBlankState = true;
      } else if (isLogoSlide || !hasTextContent) {
        // LOGO SLIDE OR NO SONG: Show official logo standby screen
        textEl.classList.add('hidden');
        textEl.style.display = 'none';
        if (standbyEl) standbyEl.classList.remove('hidden');
        currentIsBlankState = true;
      } else {
        if (standbyEl) standbyEl.classList.add('hidden');
        textEl.classList.remove('hidden');
        textEl.style.display = 'inline-block';
        textEl.style.visibility = 'visible';
        currentIsBlankState = false;
        const isBible = Boolean(data.isBible || data.is_bible);

        // UPDATE TEXT INNERHTML ONLY WHEN RAW TEXT/BADGE CONTENT CHANGES (FLICKER-FREE)
        const textKey = `${data.text || ''}_${isBible}_${data.badgeText || ''}_${data.badgeClass || ''}`;
        if (currentTextState !== textKey) {
          currentTextState = textKey;
          textEl.innerHTML = formatPresenterText(data.text, isBible, data.badgeText, data.badgeClass);
        }

        // APPLY STYLING & FIT TO SAFE AREA IN-PLACE WITHOUT RE-CREATING DOM
        fitTextToSafeArea(isBible);

        // HIGHLIGHT LINE LOGIC (UPDATE IN-PLACE WITH NO FLICKER)
        if (data.highlightedLines !== undefined) {
          if (!lastStyleData) lastStyleData = {};
          lastStyleData.highlightedLines = data.highlightedLines;
          if (data.highlightColor) lastStyleData.highlightColor = data.highlightColor;
        }

        const hColor = (lastStyleData && lastStyleData.highlightColor) || '#ef4444';
        const activeHighlights = (lastStyleData && lastStyleData.highlightedLines) || [];

        const segments = Array.from(textEl.querySelectorAll('.obs-line-segment'));
        segments.forEach((seg, idx) => {
          const segLineIdx = parseInt(seg.dataset.lineIdx !== undefined ? seg.dataset.lineIdx : idx);
          const isH = Array.isArray(activeHighlights) ? activeHighlights.includes(segLineIdx) : (activeHighlights === segLineIdx);
          if (isH) {
            seg.style.setProperty('--highlight-bg', `${hColor}cc`);
            if (!seg.classList.contains('line-highlighted')) {
              seg.classList.remove('line-unhighlighting');
              seg.classList.add('line-highlighted', 'line-animating');
              setTimeout(() => seg.classList.remove('line-animating'), 650);
            }
          } else {
            seg.classList.remove('line-highlighted', 'line-animating', 'line-unhighlighting');
          }
        });

        if (_lastAnimSlideText !== data.text || currentAnimState !== animType) {
          _lastAnimSlideText = data.text;
          currentAnimState = animType;

          box.classList.remove('animate-appear-slide', 'animate-appear-drop', 'animate-appear-pop', 'animate-appear-flip', 'animate-appear-glow');
          textEl.classList.remove('animate-appear-slide', 'animate-appear-drop', 'animate-appear-pop', 'animate-appear-flip', 'animate-appear-glow');

          if (animType !== 'none' && data.text) {
            void box.offsetWidth;
            box.classList.add(`animate-appear-${animType}`);
          }
        }
        currentIsBlankState = false;

        // ALL-IN-ONE REAL-TIME SCROLL SYNCHRONIZATION
        if ((data.mode === 'allinone' || (data.text && data.text.includes('allinone-slide-group'))) && data.scrollRatio !== undefined && !isNaN(data.scrollRatio)) {
          const docEl = document.documentElement || document.body;
          const maxScrollHeight = Math.max(0, docEl.scrollHeight - window.innerHeight);
          if (maxScrollHeight > 0) {
            const targetY = Math.round(data.scrollRatio * maxScrollHeight);
            window.scrollTo({ top: targetY, behavior: 'smooth' });
          }
        }
      }

      // UPDATE FOOTER BAR (SCALE BADGE & SLIDE COUNTER)
      const footerBarEl = document.getElementById('presenter-footer-bar');
      const scaleBadgeEl = document.getElementById('presenter-scale-badge');
      const scaleTextEl = document.getElementById('scale-text');
      const counterBadgeEl = document.getElementById('presenter-slide-counter');
      const counterTextEl = document.getElementById('counter-text');

      if (footerBarEl) {
        let hasFooter = false;
        if (data.scaleText && String(data.scaleText).trim().length > 0 && !data.isBible && !data.is_bible) {
          const cleanScaleText = String(data.scaleText).replace(/\s*\([^)]*\)/g, '').trim();
          if (scaleTextEl) scaleTextEl.textContent = `السلم: ${cleanScaleText}`;
          if (scaleBadgeEl) scaleBadgeEl.classList.remove('hidden');
          hasFooter = true;
        } else if (scaleBadgeEl) {
          scaleBadgeEl.classList.add('hidden');
        }

        if (data.currentSlide && data.totalSlides) {
          if (counterTextEl) counterTextEl.textContent = `${data.currentSlide} من ${data.totalSlides}`;
          if (counterBadgeEl) counterBadgeEl.classList.remove('hidden');
          hasFooter = true;
        } else if (counterBadgeEl) {
          counterBadgeEl.classList.add('hidden');
        }

        if (hasFooter && !data.isBlank) {
          footerBarEl.classList.remove('hidden');
        } else {
          footerBarEl.classList.add('hidden');
        }
      }

      // POSITIONING LOGIC: Black screen mode is strictly locked at center (50%, 50%). Green screen is adjustable.
      const currentChroma = document.body.getAttribute('data-chroma');
      if (currentChroma !== 'green') {
        currentPivot = { xPct: 50, yPct: 50 };
        box.style.left = '50%';
        box.style.top = '50%';
        box.style.transform = 'translate(-50%, -50%)';
        box.style.cursor = 'default';
      } else if (data.pos && !isDragging) {
        let x = data.pos.xPct;
        let y = data.pos.yPct;

        if (x === undefined && data.pos.left !== undefined) {
          x = (data.pos.left / window.innerWidth) * 100;
        }
        if (y === undefined && data.pos.top !== undefined) {
          y = (data.pos.top / window.innerHeight) * 100;
        }

        if (x !== undefined && y !== undefined && !isNaN(x) && !isNaN(y)) {
          currentPivot = { xPct: x, yPct: y };
          box.style.left = x + '%';
          box.style.top = y + '%';
          box.style.transform = 'translate(-50%, -50%)';
          localStorage.setItem('sunday_school_taranim_drag_pivot', JSON.stringify(currentPivot));
        }
      }
    }

    // 1. CEF BACKGROUND OCCLUSION & SLEEP OVERRIDE
    try {
      Object.defineProperty(document, 'hidden', { get: () => false, configurable: true });
      Object.defineProperty(document, 'visibilityState', { get: () => 'visible', configurable: true });
      document.addEventListener('visibilitychange', (e) => { e.stopImmediatePropagation(); }, true);
    } catch(e) {}

    let lastRenderedPayloadHash = null;

    function checkAndApplyLatestState(explicitData = null) {
      try {
        let data = explicitData;
        let raw = null;

        if (!data) {
          raw = localStorage.getItem('sunday_school_taranim_live_presentation');
          if (!raw) return;
          if (raw === lastRenderedPayloadHash) return;
          data = JSON.parse(raw);
        } else {
          try { raw = JSON.stringify(data); } catch(e) {}
        }

        if (data && typeof data === 'object') {
          if (data.forceRefresh) {
            currentTextState = null;
            _lastAnimSlideText = null;
            lastRenderedPayloadHash = null;
          } else {
            if (raw) lastRenderedPayloadHash = raw;
          }
          if (data.updatedAt) lastLocalPayloadTime = data.updatedAt;
          applyState(data, 'local');
        }
      } catch(e) {}
    }

    // 2. UNTHROTTLED BACKGROUND WEB WORKER TICKER (NEVER SLEEPS OR THROTTLES IN CEF)
    try {
      const workerBlob = new Blob([`
        setInterval(function() {
          postMessage('tick');
        }, 20);
      `], { type: 'application/javascript' });
      const bgWorker = new Worker(URL.createObjectURL(workerBlob));
      bgWorker.onmessage = function() {
        checkAndApplyLatestState();
      };
    } catch(e) {}

    if (channel) {
      channel.onmessage = (event) => {
        if (event.data) {
          checkAndApplyLatestState(event.data);
        }
      };
    }

    window.addEventListener('storage', (e) => {
      if (e.key === 'sunday_school_taranim_live_presentation') {
        checkAndApplyLatestState();
      }
    });

    setInterval(() => {
      checkAndApplyLatestState();
    }, 20);

    function tickObsFrame() {
      checkAndApplyLatestState();
      requestAnimationFrame(tickObsFrame);
    }
    requestAnimationFrame(tickObsFrame);

    const initialLiveRaw = localStorage.getItem('sunday_school_taranim_live_presentation');
    if (initialLiveRaw) {
      checkAndApplyLatestState();
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }

    let isFetching = false;
    let lastFetchStartTime = 0;
    let activeLiveApiUrl = null;

    async function fetchLiveHTTP() {
      // 1. IF WI-FI / INTERNET IS OFF, SILENTLY BYPASS NETWORK FETCH (100% OFFLINE MODE)
      if (navigator.onLine === false) return;

      // 2. IF LOCAL STORAGE / BROADCAST WAS UPDATED IN LAST 10 SECONDS (SAME DEVICE PRESENTER), BYPASS INTERNET HTTP FETCH!
      if (Date.now() - lastLocalPayloadTime < 10000) {
        return;
      }

      // AUTO-HEALING DEADLOCK BREAKER: Reset after 1000ms
      if (isFetching && (Date.now() - lastFetchStartTime > 1000)) {
        isFetching = false;
      }
      if (isFetching || isDragging || (Date.now() - lastDragTime < 1200)) return;
      isFetching = true;
      lastFetchStartTime = Date.now();

      // 800ms abort timeout (was 2000ms) — fail fast, retry fast
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 800);
      const ts = Date.now();

      try {
        let url = activeLiveApiUrl || (getApiUrl() + '?action=live');
        url += (url.includes('?') ? '&' : '?') + '_t=' + ts;

        let res = await fetch(url, { cache: 'no-cache', signal: controller.signal });
        if (res.ok) {
          let data = await res.json();
          if (data && (data.type === 'PRESENT_LINE' || data.text !== undefined)) {
            applyState(data, 'http');
          }
        } else {
          activeLiveApiUrl = null;
          fetchFallbackLive(ts);
        }
      } catch (err) {
        if (!activeLiveApiUrl) {
          fetchFallbackLive(ts);
        } else {
          // Cached URL failed — reset and retry with fallback discovery
          activeLiveApiUrl = null;
        }
      } finally {
        clearTimeout(timeoutId);
        isFetching = false;
      }
    }

    let lastFallbackTime = 0;
    async function fetchFallbackLive(ts) {
      if (Date.now() - lastFallbackTime < 1500) return;
      lastFallbackTime = Date.now();

      const fallbackUrls = [
        'api.php?action=live',
        '../api.php?action=live',
        '/taranim/api.php?action=live',
        '/api.php?action=live'
      ].map(u => u + (u.includes('?') ? '&' : '?') + '_t=' + ts);

      const raceController = new AbortController();
      const raceTimeout = setTimeout(() => raceController.abort(), 800);

      const promises = fallbackUrls.map(url =>
        fetch(url, { cache: 'no-cache', signal: raceController.signal })
          .then(async res => {
            if (res.ok) {
              const data = await res.json();
              if (data && (data.type === 'PRESENT_LINE' || data.text !== undefined)) {
                return { url: url.replace(/[?&]_t=\d+/, ''), data };
              }
            }
            return null;
          })
          .catch(() => null)
      );

      try {
        const results = await Promise.all(promises);
        const winner = results.find(r => r !== null);
        if (winner) {
          raceController.abort();
          activeLiveApiUrl = winner.url;
          applyState(winner.data, 'http');
        }
      } catch(e) {}
      clearTimeout(raceTimeout);
    }

    // WORKER TIMER (80MS TICKS — OPTIMAL FOR MOBILE HOTSPOT & LOCAL DISPLAY SYNC)
    let workerTimer = null;
    try {
      const workerBlob = new Blob([
        "let t = null; onmessage = function(e) { if (e.data === 'start') { clearInterval(t); t = setInterval(function() { postMessage('tick'); }, 80); } else if (e.data === 'stop') { clearInterval(t); } };"
      ], { type: 'application/javascript' });
      workerTimer = new Worker(URL.createObjectURL(workerBlob));
      workerTimer.onmessage = function() { fetchLiveHTTP(); };
      workerTimer.postMessage('start');
    } catch (e) {
      setInterval(fetchLiveHTTP, 80);
    }

    // INITIALIZE INSTANTLY FROM LOCAL STORAGE SETTINGS / LIVE PAYLOAD ON STARTUP
    (function initSavedState() {
      try {
        const savedLive = localStorage.getItem('sunday_school_taranim_live_presentation');
        if (savedLive) {
          const parsedLive = JSON.parse(savedLive);
          applyState(parsedLive, 'local');
        } else {
          const savedSettings = localStorage.getItem('sunday_school_taranim_style_settings');
          if (savedSettings) {
            const parsedSettings = JSON.parse(savedSettings);
            applyState(parsedSettings, 'local');
          }
        }
      } catch(e) {}
    })();

    // IMMEDIATE RE-FETCH ON VISIBILITY OR FOCUS RESTORATION
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H' || e.key === 'ا') {
        document.body.classList.toggle('controls-hidden');
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') fetchLiveHTTP();
    });
    window.addEventListener('focus', fetchLiveHTTP);
    window.addEventListener('online', fetchLiveHTTP);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // STEALTH POPOUT WINDOW ENGINE
    (function initStealthMode() {
      const urlParams = new URLSearchParams(window.location.search);
      const isStealthParam = urlParams.has('stealth');
      const stealthBar = document.getElementById('stealth-control-bar');

      if (isStealthParam && stealthBar) {
        stealthBar.classList.remove('hidden');
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 's' || e.key === 'S' || e.key === 'س') {
          if (stealthBar) stealthBar.classList.toggle('hidden');
        }
      });

      const btnToggleMiniStealth = document.getElementById('btn-toggle-mini-stealth');
      const miniStealthTxt = document.getElementById('mini-stealth-txt');
      let isMiniStealth = false;

      if (btnToggleMiniStealth) {
        btnToggleMiniStealth.addEventListener('click', () => {
          isMiniStealth = !isMiniStealth;
          document.body.classList.toggle('is-mini-stealth', isMiniStealth);
          if (isMiniStealth) {
            try { window.resizeTo(340, 200); } catch(err) {}
            if (miniStealthTxt) miniStealthTxt.textContent = 'تكبير النافذة';
          } else {
            try { window.resizeTo(640, 360); } catch(err) {}
            if (miniStealthTxt) miniStealthTxt.textContent = 'تصغير خفي';
          }
        });
      }

      const btnToggleStealthChroma = document.getElementById('btn-toggle-stealth-chroma');
      if (btnToggleStealthChroma) {
        btnToggleStealthChroma.addEventListener('click', () => {
          const currentChroma = document.body.getAttribute('data-chroma') || 'black';
          const nextChroma = currentChroma === 'black' ? 'green' : (currentChroma === 'green' ? 'transparent' : 'black');
          document.body.setAttribute('data-chroma', nextChroma);
        });
      }

      const btnHideStealthBar = document.getElementById('btn-hide-stealth-bar');
      if (btnHideStealthBar && stealthBar) {
        btnHideStealthBar.addEventListener('click', () => {
          stealthBar.classList.add('hidden');
        });
      }
    })();
  </script>
</body>
</html>
