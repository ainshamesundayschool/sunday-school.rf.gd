  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    
    .fa, .fas, .far, .fab, .fa-solid, .fa-regular, .fa-brands, [class*=" fa-"], [class^="fa-"] {
      font-family: "Font Awesome 6 Free", "Font Awesome 6 Brands" !important;
    }
    
    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000000;
      font-family: 'Alexandria', sans-serif;
      cursor: default;
    }

    html[data-chroma="green"], body[data-chroma="green"] { background: #00FF00 !important; background-color: #00FF00 !important; }
    html[data-chroma="blue"], body[data-chroma="blue"] { background: #0000FF !important; background-color: #0000FF !important; }
    html[data-chroma="black"], body[data-chroma="black"] { background: #000000 !important; background-color: #000000 !important; }
    html[data-chroma="transparent"], body[data-chroma="transparent"] { background: transparent !important; background-color: transparent !important; }

    /* STEALTH OBS WINDOW CONTROL TOOLBAR */
    .stealth-bar {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999999;
      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 6px 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .stealth-bar.hidden {
      display: none !important;
    }
    .stealth-bar-content {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .stealth-badge {
      color: #60a5fa;
      font-size: 0.82rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }
    .stealth-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .stealth-btn {
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.2s ease;
    }
    .stealth-btn:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-1px);
    }
    .stealth-btn.stealth-close {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .stealth-btn.stealth-close:hover {
      background: rgba(239, 68, 68, 0.45);
      color: #ffffff;
    }

    body.is-mini-stealth {
      font-size: 0.6em !important;
    }
    body.is-mini-stealth .line-text {
      font-size: 32px !important;
    }

    /* MAGNETIC SNAP GUIDES */
    .snap-guide {
      position: absolute;
      z-index: 50;
      pointer-events: none;
      border-color: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
    }

    .snap-guide.vertical {
      top: 0;
      bottom: 0;
      left: 50%;
      border-left: 2px dashed #f59e0b;
    }

    .snap-guide.horizontal {
      left: 0;
      right: 0;
      top: 50%;
      border-top: 2px dashed #f59e0b;
    }

    .lower-third-container {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 96vw;
      height: 90vh;
      max-width: 96vw;
      max-height: 90vh;
      text-align: center;
      padding: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      overflow: visible;
      cursor: grab;
    }

    .line-text {
      display: block;
      font-size: 54px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.35;
      white-space: normal;
      text-align: center;
      margin: 0 auto;
      width: 100%;
      max-width: 96vw;
      overflow: visible;
      word-break: keep-all;
      overflow-wrap: break-word;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95);
      will-change: transform, opacity;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    @media (min-width: 769px) and (orientation: landscape) {
      .lower-third-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 92vw;
        max-width: 92vw;
        padding-top: 0.5rem;
        padding-bottom: 0.5rem;
        max-height: 90vh;
        box-sizing: border-box;
      }
      .line-text {
        width: 100%;
        max-width: 100%;
        line-height: 1.35;
        margin-top: 0;
        margin-bottom: 0;
        box-sizing: border-box;
      }
      .obs-line-segment {
        width: 100%;
        white-space: normal;
        word-break: keep-all;
        overflow-wrap: break-word;
        display: block;
        text-align: center;
        margin-top: 0.15em;
        margin-bottom: 0.15em;
      }
    }

    /* ALL IN ONE SCROLLABLE PRESENTATION MODE - PRESENTER WINDOW FIX */
    body[data-mode="allinone"] .lower-third-container,
    body[data-mode="allinone"] #presenter-box {
      display: block !important;
      position: absolute !important;
      top: 30px !important;
      bottom: 30px !important;
      left: 50% !important;
      transform: translateX(-50%) !important;
      width: 96vw !important;
      max-width: 96vw !important;
      height: calc(100vh - 60px) !important;
      max-height: calc(100vh - 60px) !important;
      overflow-y: auto !important;
      pointer-events: auto !important;
      scroll-behavior: smooth !important;
      padding-top: 25px !important;
      padding-bottom: 50px !important;
      padding-right: 20px !important;
      padding-left: 20px !important;
      box-sizing: border-box !important;
      -ms-overflow-style: none !important;
      scrollbar-width: none !important;
    }

    #presenter-box::-webkit-scrollbar,
    .lower-third-container::-webkit-scrollbar,
    body[data-mode="allinone"] #presenter-box::-webkit-scrollbar,
    body[data-mode="allinone"] .lower-third-container::-webkit-scrollbar {
      display: none !important;
      width: 0 !important;
      height: 0 !important;
      background: transparent !important;
    }

    .allinone-slide-group {
      display: block !important;
      width: 100% !important;
      margin-bottom: 1.8rem !important;
      padding-bottom: 1rem !important;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.3) !important;
      text-align: center !important;
      position: relative !important;
      padding-right: 48px !important;
      padding-left: 20px !important;
      box-sizing: border-box !important;
      overflow: visible !important;
    }

    .allinone-slide-group .slide-badge-layer {
      position: absolute !important;
      right: 8px !important;
      left: auto !important;
      top: 4px !important;
      transform: none !important;
      margin: 0 !important;
      font-size: 0.85em !important;
      font-weight: 800 !important;
      display: inline-block !important;
      visibility: visible !important;
      opacity: 1 !important;
      z-index: 15 !important;
    }

    .allinone-slide-group:last-child {
      border-bottom: none !important;
    }

    @media (max-width: 768px) {
      .lower-third-container {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 96vw;
        max-width: 96vw;
        height: auto;
        max-height: 90vh;
        margin: 0 auto;
        padding: 5px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      }
      .line-text {
        height: auto;
        line-height: 1.35;
        width: 100%;
        max-width: 96vw;
        margin: 0 auto;
      }
      .obs-line-segment {
        width: 100%;
        white-space: normal;
        word-break: keep-all;
        overflow-wrap: break-word;
        display: block;
        text-align: center;
        margin-top: 0.15em;
        margin-bottom: 0.15em;
      }
    }

    /* TEXT APPEARANCE ANIMATIONS - SMOOTH & FLICKER-FREE */
    @keyframes textAppearFade {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    @keyframes textAppearSlide {
      0% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes textAppearDrop {
      0% { opacity: 0; transform: translateY(-12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes textAppearPop {
      0% { opacity: 0; transform: scale(0.96); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes textAppearFlip {
      0% { opacity: 0; transform: perspective(400px) rotateX(-12deg); }
      100% { opacity: 1; transform: perspective(400px) rotateX(0deg); }
    }

    @keyframes textAppearGlow {
      0% { opacity: 0; transform: scale(1.02); }
      100% { opacity: 1; transform: scale(1); }
    }

    .animate-appear-fade {
      animation: textAppearFade 0.16s ease-out forwards !important;
      will-change: opacity;
    }

    .animate-appear-slide {
      animation: textAppearSlide 0.16s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      will-change: transform, opacity;
    }

    .animate-appear-drop {
      animation: textAppearDrop 0.16s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      will-change: transform, opacity;
    }

    .animate-appear-pop {
      animation: textAppearPop 0.16s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      will-change: transform, opacity;
    }

    .animate-appear-flip {
      animation: textAppearFlip 0.16s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      will-change: transform, opacity;
    }

    .animate-appear-glow {
      animation: textAppearGlow 0.16s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      will-change: transform, opacity;
    }

    /* FULL SCENE WRAPPER & TWO-LAYER ARCHITECTURE */
    .scene-presentation-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
      z-index: 10;
    }

    .scene-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      pointer-events: none;
      will-change: clip-path, opacity, transform;
    }

    .scene-slides-layer {
      z-index: 5;
    }

    .scene-standby-layer {
      z-index: 6;
      background: transparent;
    }

    /* SLIDES BACKGROUND MEDIA CONTAINER */
    .slides-bg-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slides-bg-media {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transition: object-fit 0.2s ease;
    }

    /* STANDBY CUSTOM FULLSCREEN MEDIA */
    .standby-fullscreen-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .standby-fullscreen-media {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      transition: object-fit 0.2s ease;
    }

    /* MEDIA FIT MODES */
    .media-fit-cover {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: cover !important;
    }
    .media-fit-fit_width {
      width: 100vw !important;
      height: auto !important;
      max-height: 100vh !important;
      object-fit: contain !important;
      margin: auto !important;
    }
    .media-fit-fit_height {
      width: auto !important;
      height: 100vh !important;
      max-width: 100vw !important;
      object-fit: contain !important;
      margin: auto !important;
    }
    .media-fit-fill {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: fill !important;
    }
    .media-fit-contain {
      width: 100vw !important;
      height: 100vh !important;
      object-fit: contain !important;
    }

    /* STINGER VIDEO TRANSITION OVERLAY (ALPHA WEBM) */
    .stinger-transition-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 999999;
      pointer-events: none;
      background: transparent !important;
    }

    /* TRUE BROADCAST CENTERED RADIAL LUMA REVEAL */
    .luma-wipe-incoming-center {
      z-index: 30 !important;
      animation: obsLumaCenterReveal 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
      will-change: clip-path, -webkit-clip-path;
    }

    @keyframes obsLumaCenterReveal {
      0% {
        clip-path: circle(0% at 50% 50%);
        -webkit-clip-path: circle(0% at 50% 50%);
      }
      100% {
        clip-path: circle(125% at 50% 50%);
        -webkit-clip-path: circle(125% at 50% 50%);
      }
    }

    /* SMOOTH FADE REVEAL */
    .trans-fade-incoming {
      z-index: 30 !important;
      animation: obsFadeReveal 0.65s ease-in-out forwards !important;
      will-change: opacity;
    }

    @keyframes obsFadeReveal {
      0% { opacity: 0; }
      100% { opacity: 1; }
    }

    /* SMOOTH ZOOM & POP REVEAL */
    .trans-zoom-incoming {
      z-index: 30 !important;
      animation: obsZoomReveal 0.65s cubic-bezier(0.16, 1, 0.3, 1) forwards !important;
      will-change: opacity, transform;
    }

    @keyframes obsZoomReveal {
      0% { opacity: 0; transform: scale(0.88); }
      100% { opacity: 1; transform: scale(1); }
    }

    .standby-branding {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
      text-align: center;
      padding: 0;
      margin: 0;
      z-index: 10;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .standby-branding .standby-logo {
      width: 220px;
      height: 220px;
      max-width: 60vw;
      max-height: 45vh;
      object-fit: contain;
      border-radius: 0 !important;
      border: none !important;
      box-shadow: none !important;
    }

    .standby-branding .standby-title {
      display: none !important;
    }

    /* INTERACTIVE TEXT TRANSFORMS (SCALE / POS X / POS Y / ROTATION) */
    .lower-third-container {
      transform: translate(calc(-50% + var(--text-pos-x, 0%)), calc(-50% + var(--text-pos-y, 0%))) scale(var(--text-scale, 1)) rotate(var(--text-rot, 0deg)) !important;
      transform-origin: center center !important;
    }

    .blank-blackout-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: 100vw;
      height: 100vh;
      background: #000000 !important;
      z-index: 9999999 !important;
      pointer-events: auto;
      opacity: 1;
    }

    .btn-close-overlay-left {
      position: fixed !important;
      bottom: 12px !important;
      left: 12px !important;
      top: auto !important;
      right: auto !important;
      min-width: 32px !important;
      min-height: 32px !important;
      width: 32px !important;
      height: 32px !important;
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: none !important;
      color: rgba(255, 255, 255, 0.45) !important;
      border-radius: 50%;
      font-size: 0.85rem !important;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 99999 !important;
      transition: all 0.2s ease;
      box-shadow: none !important;
      pointer-events: auto !important;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      opacity: 0.7;
    }

    .btn-close-overlay-left:hover,
    .btn-close-overlay-left:active {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      color: rgba(255, 255, 255, 0.95) !important;
      opacity: 1;
    }

    /* CRITICAL: DISABLE TRANSITIONS ON PRESENTATION TEXT TO PREVENT FLICKERING DURING RESIZE */
    #obs-line-text,
    .obs-line-text,
    .obs-slide-wrapper,
    .obs-lines-wrapper,
    .obs-line-row,
    .obs-line-segment,
    .obs-lower-third-box {
      transition: none !important;
      animation-duration: 0s !important;
    }

    /* Sleek bottom footer info bar for presenter display - NO BACKGROUND OVERLAY */
    .presenter-scale-badge {
      position: fixed;
      bottom: 12px;
      right: 14px !important;
      left: auto !important;
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: none !important;
      color: rgba(255, 255, 255, 0.55) !important;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0;
      border-radius: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: none !important;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      letter-spacing: 0.3px;
      z-index: 999;
      direction: rtl;
      font-family: 'Baloo Bhaijaan 2', 'Alexandria', sans-serif;
      pointer-events: none;
    }

    .presenter-slide-counter {
      position: fixed;
      bottom: 12px;
      left: 50% !important;
      transform: translateX(-50%) !important;
      right: auto !important;
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: none !important;
      color: rgba(255, 255, 255, 0.55) !important;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0;
      border-radius: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: none !important;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      letter-spacing: 0.3px;
      z-index: 999;
      direction: rtl;
      font-family: 'Baloo Bhaijaan 2', 'Alexandria', sans-serif;
      pointer-events: none;
    }

    /* HIDE CONTROLS MODE */
    body.controls-hidden #btn-close-window-bottom,
    body.controls-hidden .btn-close-overlay-left,
    body.controls-hidden #presenter-footer-bar,
    body.controls-hidden #presenter-slide-counter,
    body.controls-hidden .obs-top-left-header {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .obs-top-left-header {
      position: absolute;
      top: 1.8rem;
      left: 2.2rem;
      color: rgba(255, 255, 255, 0.75);
      font-size: 1.5rem;
      font-weight: 800;
      z-index: 100;
      letter-spacing: 0.5px;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
      font-family: inherit;
    }

    .chorus-num,
    .chorus-badge-side,
    .slide-badge-layer.chorus-badge-side,
    .slide-badge-layer.chorus-num {
      color: #ef4444 !important;
      font-weight: 700 !important;
      font-size: 0.62em !important;
    }

    .badge-num,

    .obs-line-row {
      display: block;
      width: 100%;
      max-width: 100%;
      text-align: center;
      margin: 0.15em 0;
      box-sizing: border-box;
    }

    .obs-line-segment {
      position: relative;
      isolation: isolate;
      display: block;
      width: 100%;
      max-width: 100%;
      box-sizing: border-box;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
      transition: color 0.25s ease;
    }

    .obs-line-segment.line-highlighted {
      position: relative;
      isolation: isolate;
      z-index: 5;
      transform: none !important;
      font-size: inherit !important;
      font-weight: inherit !important;
    }

    .obs-line-segment.line-highlighted::before {
      content: '';
      position: absolute;
      top: 10%;
      bottom: 5%;
      left: -8px;

      clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
      opacity: 1 !important;
      display: block !important;
    }

    .obs-line-segment.line-animating::before {
      animation: highlightLinearWipe 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: clip-path, opacity;
    }

    @keyframes highlightLinearWipe {
      0% {
        clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
        opacity: 0;
      }
      100% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        opacity: 1;
      }
    }

    .obs-line-segment.line-unhighlighting::before {
      animation: highlightFadeOut 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes highlightFadeOut {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    .hidden { display: none !important; }

  <!-- SLEEK ICON EXIT BUTTON AT LEFT END -->
  <button id="btn-close-window-bottom" class="btn-close-overlay-left" onclick="closePresentationWindow(event)" title="إغلاق النافذة (Esc)">
    <i class="fa-solid fa-xmark"></i>
  </button>

  <script>
    const obsChannel = ('BroadcastChannel' in window) ? new BroadcastChannel('sunday_school_taranim_obs_channel') : null;

    const returnFocusToControlPanel = () => {
      try {
        if (obsChannel) {
          obsChannel.postMessage({ type: 'FOCUS_CONTROL_PANEL' });
        }
      } catch (err) {}
      const isFS = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      if (!isFS) {
        try {
          if (window.opener && !window.opener.closed) {
            window.opener.focus();
          }
        } catch (err) {}
      }
    };

    function updateFullscreenBtnIcon() {
      const btn = document.getElementById('btn-close-window-bottom');
      if (!btn) return;
      const isFS = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      if (isFS) {
        btn.innerHTML = `<i class="fa-solid fa-xmark"></i>`;
        btn.title = 'إنهاء ملء الشاشة (Esc)';
      } else {
        btn.innerHTML = `<i class="fa-solid fa-expand"></i>`;
        btn.title = 'ملء الشاشة';
      }
    }

    document.addEventListener('fullscreenchange', updateFullscreenBtnIcon);
    document.addEventListener('webkitfullscreenchange', updateFullscreenBtnIcon);
    document.addEventListener('DOMContentLoaded', updateFullscreenBtnIcon);

    function closePresentationWindow(e) {
      if (e) {
        if (typeof e.preventDefault === 'function') e.preventDefault();
        if (typeof e.stopPropagation === 'function') e.stopPropagation();
      }

      const isFS = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      if (!isFS) {
        // Not in fullscreen -> enter fullscreen
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } else {
        // In fullscreen -> exit fullscreen
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          try { document.webkitExitFullscreen(); } catch(err) {}
        }
      }
      setTimeout(updateFullscreenBtnIcon, 150);
    }
    const box = document.getElementById('presenter-box');
    const textEl = document.getElementById('presenter-text');
    const standbyEl = document.getElementById('standby-branding');
    const standbyFullscreenContainer = document.getElementById('standby-fullscreen-container');
    const standbyFullscreenImg = document.getElementById('standby-fullscreen-img');
    const standbyFullscreenVideo = document.getElementById('standby-fullscreen-video');
    const guideV = document.getElementById('snap-guide-v');
    const guideH = document.getElementById('snap-guide-h');

    let stateFontSize = 105;
    let lastDragTime = 0;
    let isDragging = false;
    let currentSlidesBgSrc = '';
    let currentStandbyBgSrc = '';
    let currentStingerSrc = '';
    let lastProcessedTimestamp = 0;
    let lastLocalPayloadTime = 0;
    let lastStyleData = null;
    let statePresentationLines = [];
    let currentTextState = null;
    let _lastAnimSlideText = null;
    let currentAnimState = null;
    let currentIsBlankState = false;
    let lastProcessedTransitionId = 0;
    let isStingerActive = false;
    let currentIsBible = false;

    function requestAutoFullscreen() {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }

    window.addEventListener('click', (e) => {
      if (e && e.target && e.target.closest && e.target.closest('#btn-close-window-bottom, .btn-close-overlay-left, button, a')) return;
      requestAutoFullscreen();
    });
    window.addEventListener('touchstart', requestAutoFullscreen);
    window.addEventListener('pointerdown', requestAutoFullscreen);

    const urlParams = new URLSearchParams(window.location.search);
    let initialChroma = urlParams.get('chroma');
    if (!initialChroma) {
      try {
        const savedLiveRaw = localStorage.getItem('sunday_school_taranim_live_presentation');
        if (savedLiveRaw) {
          const parsed = JSON.parse(savedLiveRaw);
          if (parsed && (parsed.chroma || parsed.chromaKey)) {
            initialChroma = parsed.chroma || parsed.chromaKey;
          }
        }
        if (!initialChroma) {
          const savedStyleRaw = localStorage.getItem('sunday_school_taranim_style_settings');
          if (savedStyleRaw) {
            const parsedStyle = JSON.parse(savedStyleRaw);
            if (parsedStyle && parsedStyle.chromaKey) {
              initialChroma = parsedStyle.chromaKey;
            }
          }
        }
      } catch(e) {}
    }
    if (!initialChroma) {
      initialChroma = 'black';
    }
    document.body.setAttribute('data-chroma', initialChroma);

    const screenLeft = urlParams.get('screenLeft');
    const screenTop = urlParams.get('screenTop');
    const screenIdx = urlParams.get('screenIdx');
    const isAutoFS = urlParams.get('autofs') === 'true';

    // MAXIMIZE WINDOW TO FILL TARGET SCREEN (works without user gesture on refresh)
    function maximizeToScreen() {
      try {
        const sLeft = screenLeft !== null ? parseInt(screenLeft) : (window.screen.availLeft || 0);
        const sTop = screenTop !== null ? parseInt(screenTop) : (window.screen.availTop || 0);
        const sWidth = window.screen.availWidth || window.screen.width || 1920;
        const sHeight = window.screen.availHeight || window.screen.height || 1080;
        window.moveTo(sLeft, sTop);
        window.resizeTo(sWidth, sHeight);
      } catch(e) {}
    }

    // Run immediately
    maximizeToScreen();

    // Also try after a short delay (some browsers need this)
    setTimeout(maximizeToScreen, 100);
    setTimeout(maximizeToScreen, 500);

    if (isAutoFS) {
      window.addEventListener('click', () => window.triggerFullscreen(), { once: true });
      window.addEventListener('keydown', () => window.triggerFullscreen(), { once: true });

      window.addEventListener('load', () => {
        maximizeToScreen();

        setTimeout(async () => {
          if ('getScreenDetails' in window && screenIdx !== null && screenIdx !== '-1') {
            try {
              const details = await window.getScreenDetails();
              const idx = parseInt(screenIdx);
              if (details && details.screens && details.screens[idx]) {
                const targetScreen = details.screens[idx];
                if (document.documentElement.requestFullscreen) {
                  await document.documentElement.requestFullscreen({ screen: targetScreen });
                  return;
                }
              }
            } catch (err) {}
          }
          if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
            document.documentElement.requestFullscreen().catch(() => {});
          }
        }, 300);
      });
    }

    const savedPivotRaw = localStorage.getItem('sunday_school_taranim_drag_pivot');
    let currentPivot = { xPct: 50, yPct: 50 };
    if (savedPivotRaw) {
      try {
        const parsed = JSON.parse(savedPivotRaw);
        if (parsed && parsed.xPct !== undefined && parsed.yPct !== undefined) {
          if (parsed.yPct === 75) parsed.yPct = 50;
          currentPivot = parsed;
        } else if (parsed && parsed.left !== undefined) {
          currentPivot.xPct = (parsed.left / window.innerWidth) * 100;
          currentPivot.yPct = (parsed.top / window.innerHeight) * 100;
        }
      } catch(e) {}
    }

    box.style.left = currentPivot.xPct + '%';
    box.style.top = currentPivot.yPct + '%';
    box.style.transform = 'translate3d(-50%, -50%, 0)';

    window.triggerFullscreen = function() {
      if (!document.fullscreenElement) {
        const docEl = document.documentElement;
        if (docEl.requestFullscreen) {
          docEl.requestFullscreen().catch(() => {});
        } else if (docEl.webkitRequestFullscreen) {
          docEl.webkitRequestFullscreen();
        }
      }
    };

    const channel = new BroadcastChannel('sunday_school_taranim_obs_channel');

    document.addEventListener('fullscreenchange', () => {
      if (document.fullscreenElement) {
        try {
          if (channel) channel.postMessage({ action: 'EXTERNAL_FULLSCREEN_ACTIVATED' });
        } catch(err) {}
      }
    });

    function triggerNextSlide() {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      try {
        if (channel) channel.postMessage({ action: 'NEXT_SLIDE' });
      } catch(err) {}
    }

    // AUTO-POSITION ON EXTERNAL DISPLAY IF COORDINATES ARE PASSED IN QUERY PARAMS
    (function positionOnTargetScreen() {
      try {
        const params = new URLSearchParams(window.location.search);
        const sLeft = parseInt(params.get('screenLeft'));
        const sTop = parseInt(params.get('screenTop'));
        const sWidth = parseInt(params.get('screenWidth'));
        const sHeight = parseInt(params.get('screenHeight'));
        if (!isNaN(sLeft) && !isNaN(sTop)) {
          window.moveTo(sLeft, sTop);
          if (!isNaN(sWidth) && !isNaN(sHeight)) {
            window.resizeTo(sWidth, sHeight);
          }
        }
      } catch(e) {}
    })();

    function triggerPrevSlide() {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
      try {
        if (channel) channel.postMessage({ action: 'PREV_SLIDE' });
      } catch(err) {}
    }

    let lastTouchTime = 0;

    window.addEventListener('click', (e) => {
      if (e.target && e.target.closest && e.target.closest('#btn-close-window-bottom, .btn-close-overlay-left, button, a')) return;
      if (Date.now() - lastTouchTime < 500) return;
      const currentChroma = document.body.getAttribute('data-chroma');
      if (currentChroma === 'green' && isDragging) return;
      triggerNextSlide();
    });

    // TOUCH SWIPE & TAP GESTURE SUPPORT FOR SLIDE NAVIGATION
    let touchStartX = 0;
    let touchStartY = 0;
    let touchStartTime = 0;

    window.addEventListener('touchstart', (e) => {
      if (e.target && e.target.closest && e.target.closest('#btn-close-window-bottom, .btn-close-overlay-left, button, a')) return;
      if (e.touches && e.touches.length > 0) {
        touchStartX = e.touches[0].clientX;
        touchStartY = e.touches[0].clientY;
        touchStartTime = Date.now();
      }
    }, { passive: true });

    window.addEventListener('touchend', (e) => {
      if (e.target && e.target.closest && e.target.closest('#btn-close-window-bottom, .btn-close-overlay-left, button, a')) return;
      if (!e.changedTouches || e.changedTouches.length === 0) return;
      const currentChroma = document.body.getAttribute('data-chroma');
      if (currentChroma === 'green' && isDragging) return;

      lastTouchTime = Date.now();

      const deltaX = e.changedTouches[0].clientX - touchStartX;
      const deltaY = e.changedTouches[0].clientY - touchStartY;
      const elapsed = Date.now() - touchStartTime;

      if (elapsed > 700) return;

      // Small touch movement (< 15px) = Tap / Click → Next slide
      if (Math.abs(deltaX) < 15 && Math.abs(deltaY) < 15) {
        triggerNextSlide();
        return;
      }

      // Horizontal swipe (Right-to-Left deltaX < 0 = Next slide)
      if (Math.abs(deltaX) >= 25 && Math.abs(deltaX) > Math.abs(deltaY)) {
        if (deltaX < 0) {
          triggerNextSlide();
        } else {
          triggerPrevSlide();
        }
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        triggerNextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp' || e.key === 'PageUp') {
        e.preventDefault();
        triggerPrevSlide();
      } else if (e.key === 'f' || e.key === 'F' || e.key === 'ب' || e.key === '[' || e.code === 'KeyF') {
        e.preventDefault();
        requestAutoFullscreen();
      }
    });

    window.addEventListener('resize', () => {
      fitTextToSafeArea();
    });

    // Dynamic Shadow State

    function applyDynamicShadow(newData) {
      if (newData) {
        lastStyleData = { ...lastStyleData, ...newData };
      }
      const data = lastStyleData;
      
      const currentFontSize = parseFloat(textEl.style.fontSize) || data.fontSize || stateFontSize || 54;
      const scale = currentFontSize / 54;

      const strokeWidth = parseInt(data.strokeWidth || 0);
      const strokeColor = data.strokeColor || '#000000';

      const angleDeg = (data && data.shadowAngle !== undefined) ? data.shadowAngle : 142;
      const baseDistPx = (data && data.shadowDistance !== undefined) ? data.shadowDistance : 13;
      const baseShadowBlur = (data && data.shadowBlur !== undefined) ? data.shadowBlur : 18;
      const shadowColor = (data && data.shadowColor) ? data.shadowColor : '#000000';

      const scaledStrokeWidth = strokeWidth > 0 ? Math.max(1, Math.round(strokeWidth * scale)) : 0;
      const scaledDistPx = Math.round(baseDistPx * scale);
      const scaledShadowBlur = Math.round(baseShadowBlur * scale);

      const rad = (angleDeg || 142) * Math.PI / 180;
      const offX = Math.round(scaledDistPx * Math.cos(rad));
      const offY = Math.round(scaledDistPx * Math.sin(rad));

      textEl.style.paintOrder = 'stroke fill markers';
      textEl.style.webkitPaintOrder = 'stroke fill markers';

      let shadowParts = [];
      if (scaledStrokeWidth > 0) {
        textEl.style.webkitTextStroke = `${scaledStrokeWidth}px ${strokeColor}`;
        textEl.style.textStroke = `${scaledStrokeWidth}px ${strokeColor}`;
        
        for (let angle = 0; angle < 360; angle += 22.5) {
          const rA = angle * Math.PI / 180;
          const sx = (scaledStrokeWidth * Math.cos(rA)).toFixed(1);
          const sy = (scaledStrokeWidth * Math.sin(rA)).toFixed(1);
          shadowParts.push(`${sx}px ${sy}px 0 ${strokeColor}`);
        }
      } else {
        textEl.style.webkitTextStroke = '0px transparent';
        textEl.style.textStroke = '0px transparent';
      }

      if (scaledShadowBlur > 0 || scaledDistPx > 0) {
        shadowParts.push(`${offX}px ${offY}px ${scaledShadowBlur}px ${shadowColor}`);
      }
      const finalShadow = shadowParts.length > 0 ? shadowParts.join(', ') : 'none';
      textEl.style.textShadow = finalShadow;

      const childSegs = Array.from(textEl.querySelectorAll('.obs-line-segment'));
      childSegs.forEach(s => {
        s.style.textShadow = finalShadow;
        if (scaledStrokeWidth > 0) {
          s.style.webkitTextStroke = `${scaledStrokeWidth}px ${strokeColor}`;
          s.style.textStroke = `${scaledStrokeWidth}px ${strokeColor}`;
        } else {
          s.style.webkitTextStroke = '0px transparent';
          s.style.textStroke = '0px transparent';
        }
      });
    }

    let _uniformFontSize = null;
    let _uniformSongKey = '';

    function fitTextToSafeArea(isBible = currentIsBible) {
      if (!textEl) return;
      currentIsBible = isBible;

      const container = document.getElementById('obs-overlay-container') || document.body;
      const curW = Math.max(320, container.clientWidth || window.innerWidth || 1920);
      const curH = Math.max(240, container.clientHeight || window.innerHeight || 1080);

      const baseSize = (lastStyleData && lastStyleData.fontSize) || stateFontSize || 105;
      const currentFont = (lastStyleData && lastStyleData.font) || textEl.style.fontFamily || '';
      const isJomhuria = /jomhuria/i.test(currentFont);

      const align = (lastStyleData && lastStyleData.textAlign) || textEl.style.textAlign || 'center';
      const lSpacing = (lastStyleData && lastStyleData.letterSpacing !== undefined) ? lastStyleData.letterSpacing : 0;
      const lHeight = (lastStyleData && lastStyleData.lineHeight !== undefined) ? lastStyleData.lineHeight : 1.35;
      const fWeight = (lastStyleData && lastStyleData.fontWeight) || '700';
      const fStyle = (lastStyleData && lastStyleData.fontStyle) || 'normal';
      const tDeco = (lastStyleData && lastStyleData.textDecoration) || 'none';

      if (align === 'justify' && !isJomhuria) {
        textEl.style.textAlign = 'justify';
        textEl.style.textJustify = 'inter-word';
        textEl.style.textAlignLast = 'center';
      } else {
        textEl.style.textAlign = align === 'justify' ? 'center' : align;
        textEl.style.textJustify = 'auto';
        textEl.style.textAlignLast = align === 'justify' ? 'center' : align;
      }
      textEl.style.fontStyle = fStyle;
      textEl.style.textDecoration = tDeco;

      const segments = Array.from(textEl.querySelectorAll('.obs-line-segment'));
      segments.forEach(s => {
        s.style.display = 'block';

    function formatPresenterText(rawText, isBible = false, badgeTextOverride = '', badgeClassOverride = '') {

      }

          text = text.replace(/^\s*\(?(ق|قرار|\d+|[٠-٩]+)\)?[:\s\-]*\s*/i, '').trim();
        }
      } else {
        const isChorus = /ق|قرار/i.test(detectedBadge);
        if (isChorus) {
          detectedBadge = '(ق)';
          detectedBadgeClass = 'chorus-badge-side chorus-num';
        }
        text = text.replace(/^\s*\(?(ق|قرار|\d+|[٠-٩]+)\)?[:\s\-]*\s*/i, '').trim();
      }

      let html = text
        .replace(/&/g, '&amp;')

        } else if (fitMode === 'fit_height') {
          el.style.setProperty('object-fit', 'contain', 'important');
          el.style.setProperty('width', 'auto', 'important');
          el.style.setProperty('height', '100vh', 'important');
          el.style.setProperty('max-width', '100vw', 'important');
          el.style.removeProperty('max-height');
        }
      };

      // 2. APPLY SLIDES BACKGROUND MEDIA (VIDEO / IMAGE / NONE)
      const slidesBgContainer = document.getElementById('slides-bg-container');
      const slidesBgImg = document.getElementById('slides-bg-img');
      const slidesBgVideo = document.getElementById('slides-bg-video');
      if (slidesBgContainer && data.slidesBgConfig) {
        const bgConf = data.slidesBgConfig;
        const sFit = bgConf.fitMode || 'cover';
        applyMediaFitMode(slidesBgImg, sFit);
        applyMediaFitMode(slidesBgVideo, sFit);
        const mediaUrl = bgConf.url || '';
        const isImg = /\.(jpg|jpeg|png|webp|gif|svg)$/i.test(mediaUrl) || mediaUrl.startsWith('data:image/') || bgConf.type === 'custom_image';
        const isVid = /\.(mp4|webm|mov|mkv)$/i.test(mediaUrl) || mediaUrl.startsWith('data:video/') || bgConf.type === 'custom_video';

        if (mediaUrl && (bgConf.type === 'template' || isImg || isVid)) {
          if (isImg) {
            currentSlidesBgSrc = '';
            if (slidesBgVideo) {
              try { slidesBgVideo.pause(); slidesBgVideo.removeAttribute('src'); } catch(e) {}
              slidesBgVideo.classList.add('hidden');
            }
            slidesBgImg.src = mediaUrl;
            slidesBgImg.classList.remove('hidden');
            slidesBgContainer.classList.remove('hidden');
          } else {
            if (currentSlidesBgSrc !== mediaUrl) {
              currentSlidesBgSrc = mediaUrl;
              try {
                slidesBgVideo.pause();
                slidesBgVideo.src = mediaUrl;
              } catch(e) {}
            }
            slidesBgVideo.muted = true;
            slidesBgVideo.loop = (bgConf.loop !== false);
            slidesBgVideo.classList.remove('hidden');
            slidesBgImg.classList.add('hidden');
            slidesBgContainer.classList.remove('hidden');
            if (slidesBgVideo.paused) {
              slidesBgVideo.play().catch(() => {});
            }
          }
        } else {
          currentSlidesBgSrc = '';
          slidesBgContainer.classList.add('hidden');
          if (slidesBgImg) slidesBgImg.classList.add('hidden');
          if (slidesBgVideo) {
            try {
              slidesBgVideo.pause();
              slidesBgVideo.removeAttribute('src');
            } catch(e) {}
            slidesBgVideo.classList.add('hidden');
          }
        }
      } else if (slidesBgContainer) {
        currentSlidesBgSrc = '';
        slidesBgContainer.classList.add('hidden');
        if (slidesBgImg) slidesBgImg.classList.add('hidden');
        if (slidesBgVideo) {
          try {
            slidesBgVideo.pause();
            slidesBgVideo.removeAttribute('src');
          } catch(e) {}
          slidesBgVideo.classList.add('hidden');
        }
      }

      // 3. APPLY STANDBY SCREEN MEDIA
      const updateStandbyMediaDisplay = (showStandby) => {
        const standbyConf = data.standbyConfig || { type: 'logo' };
        const stFit = standbyConf.fitMode || 'cover';
        applyMediaFitMode(standbyFullscreenImg, stFit);
        applyMediaFitMode(standbyFullscreenVideo, stFit);
        
        if (!showStandby) {
          if (standbyEl) {
            standbyEl.classList.add('hidden');
            standbyEl.style.display = 'none';
          }
          if (standbyFullscreenContainer) {
            standbyFullscreenContainer.classList.add('hidden');
            if (standbyFullscreenVideo) {
              try { standbyFullscreenVideo.pause(); } catch(e) {}
            }
          }
          return;
        }

        const sbUrl = standbyConf.url || (data.slidesBgConfig && data.slidesBgConfig.url) || '';
        const isSbImg = /\.(jpg|jpeg|png|webp|gif|svg)$/i.test(sbUrl) || sbUrl.startsWith('data:image/') || standbyConf.type === 'custom_image';
        const isSbVid = /\.(mp4|webm|mov|mkv)$/i.test(sbUrl) || sbUrl.startsWith('data:video/') || standbyConf.type === 'custom_video';

        const showLogoOnStandby = (standbyConf.showLogo !== undefined) 
          ? Boolean(standbyConf.showLogo) 
          : (standbyConf.type === 'logo' || !data.standbyConfig || data.standbyConfig.type === 'template' || (!sbUrl.includes('Shabahak')));

        if (standbyConf.type === 'logo' || (!sbUrl && standbyConf.type !== 'template')) {
          if (currentStandbyBgSrc) {
            currentStandbyBgSrc = '';
            if (standbyFullscreenVideo) { try { standbyFullscreenVideo.pause(); standbyFullscreenVideo.removeAttribute('src'); } catch(e) {} }
          }
          if (standbyFullscreenContainer) standbyFullscreenContainer.classList.add('hidden');
          if (standbyEl) {
            standbyEl.classList.remove('hidden');
            standbyEl.style.display = 'flex';
            standbyEl.style.visibility = 'visible';
            standbyEl.style.opacity = '1';
            standbyEl.style.zIndex = '20';
          }
        } else if (sbUrl || standbyConf.type === 'template' || isSbImg || isSbVid) {
          if (standbyFullscreenContainer) standbyFullscreenContainer.classList.remove('hidden');
          if (standbyEl) {
            if (showLogoOnStandby) {
              standbyEl.classList.remove('hidden');
              standbyEl.style.display = 'flex';
              standbyEl.style.visibility = 'visible';
              standbyEl.style.opacity = '1';
              standbyEl.style.zIndex = '20';
            } else {
              standbyEl.classList.add('hidden');
              standbyEl.style.display = 'none';
            }
          }

          if (isSbImg) {
            if (currentStandbyBgSrc) {
              currentStandbyBgSrc = '';
              if (standbyFullscreenVideo) { try { standbyFullscreenVideo.pause(); standbyFullscreenVideo.removeAttribute('src'); } catch(e) {} }
            }
            if (standbyFullscreenVideo) standbyFullscreenVideo.classList.add('hidden');
            if (standbyFullscreenImg) {
              standbyFullscreenImg.src = sbUrl;
              standbyFullscreenImg.classList.remove('hidden');
            }
          } else {
            if (currentStandbyBgSrc !== sbUrl) {
              currentStandbyBgSrc = sbUrl;
              if (standbyFullscreenVideo) {
                try {
                  standbyFullscreenVideo.pause();
                  standbyFullscreenVideo.src = sbUrl;
                } catch(e) {}
              }
            }
            if (standbyFullscreenImg) standbyFullscreenImg.classList.add('hidden');
            if (standbyFullscreenVideo) {
              standbyFullscreenVideo.muted = true;
              standbyFullscreenVideo.loop = (standbyConf.loop !== false);
              standbyFullscreenVideo.classList.remove('hidden');
              if (standbyFullscreenVideo.paused) standbyFullscreenVideo.play().catch(() => {});
            }
          }
        } else {
          if (currentStandbyBgSrc) {
            currentStandbyBgSrc = '';
            if (standbyFullscreenVideo) { try { standbyFullscreenVideo.pause(); standbyFullscreenVideo.removeAttribute('src'); } catch(e) {} }
          }
          if (standbyFullscreenContainer) standbyFullscreenContainer.classList.add('hidden');
          if (standbyEl) {
            standbyEl.classList.remove('hidden');
            standbyEl.style.display = 'flex';
          }
        }
      };

      const slidesLayer = document.getElementById('scene-slides-layer');
      const standbyLayer = document.getElementById('scene-standby-layer');
      let activeLumaAnimFrame = null;

      // AUTHENTIC OBS SINUS 9 LUMA WIPE DRIVER (FEATHERED CONCENTRIC SINUSOIDAL WIPER)
      const runLumaSinusWipe = (incomingEl, duration = 1150, onComplete = null) => {
        if (activeLumaAnimFrame) {
          cancelAnimationFrame(activeLumaAnimFrame);
          activeLumaAnimFrame = null;
        }

        if (!incomingEl) {
          if (typeof onComplete === 'function') onComplete();
          return;
        }

        // Apply 0% transparent mask synchronously BEFORE showing element to eliminate 1-frame preview flicker
        const initialMask = 'radial-gradient(circle at 50% 50%, transparent 0%, transparent 100%)';
        incomingEl.style.webkitMaskImage = initialMask;
        incomingEl.style.maskImage = initialMask;
        incomingEl.style.zIndex = '35';
        incomingEl.classList.remove('hidden');

        const startTime = performance.now();

        const animateWipe = (currentTime) => {
          const elapsed = currentTime - startTime;
          const progress = Math.min(1, elapsed / duration);
          // OBS smooth sinusoidal ease-in-out
          const ease = 0.5 - 0.5 * Math.cos(progress * Math.PI);
          const p = ease * 145; // expand from 0% to 145%

          // Deep sinusoidal concentric wave harmonics + soft feather
          const w0 = Math.max(0, p - 38);
          const w1 = Math.max(0, p - 26);
          const w2 = Math.max(0, p - 16);
          const w3 = Math.max(0, p - 7);
          const w4 = p;
          const w5 = p + 16;

          const maskStr = `radial-gradient(circle at 50% 50%, #000000 0%, #000000 ${w0}%, rgba(0,0,0,0.94) ${w1}%, rgba(0,0,0,0.72) ${w2}%, rgba(0,0,0,0.42) ${w3}%, rgba(0,0,0,0.18) ${w4}%, transparent ${w5}%)`;

          incomingEl.style.webkitMaskImage = maskStr;
          incomingEl.style.maskImage = maskStr;

          if (progress < 1) {
            activeLumaAnimFrame = requestAnimationFrame(animateWipe);
          } else {
            activeLumaAnimFrame = null;
            incomingEl.style.webkitMaskImage = '';
            incomingEl.style.maskImage = '';
            if (typeof onComplete === 'function') onComplete();
          }
        };

        activeLumaAnimFrame = requestAnimationFrame(animateWipe);
      };

            // 4. TRANSITIONS & DISPLAY SCENE CONTROLLER (OPTIMIZED & FLICKER-FREE)
      const shouldRunTransition = Boolean(
        data.triggerTransition && 
        data.transitionId && 
        data.transitionId !== lastProcessedTransitionId && 
        !isStingerActive
      );

      if (shouldRunTransition) {
        lastProcessedTransitionId = data.transitionId;
        const transType = data.transitionType || 'fade';
        const stingerUrl = data.stingerMediaUrl || '';
        const cutPoint = data.stingerCutPointMs || 1200;

        if (transType === 'stinger' && stingerUrl) {
          isStingerActive = true;
          const stingerEl = document.getElementById('stinger-transition-video');
          if (stingerEl) {
            if (stingerEl.src !== stingerUrl && !stingerEl.src.endsWith(stingerUrl)) {
              stingerEl.src = stingerUrl;
            }
            stingerEl.muted = true;
            stingerEl.classList.remove('hidden');
            stingerEl.style.display = 'block';
            stingerEl.currentTime = 0;
            stingerEl.play().catch(() => {});

            let contentSwapped = false;
            const swapContent = () => {
              if (contentSwapped) return;
              contentSwapped = true;
              if (isStandbyMode) {
                if (slidesLayer) slidesLayer.classList.add('hidden');
                if (standbyLayer) standbyLayer.classList.remove('hidden');
                if (textEl) textEl.classList.add('hidden');
                updateStandbyMediaDisplay(true);
                currentIsBlankState = true;
              } else {
                if (standbyLayer) standbyLayer.classList.add('hidden');
                if (slidesLayer) slidesLayer.classList.remove('hidden');
                updateStandbyMediaDisplay(false);
                if (isBlankMode || !hasTextContent) {
                  if (textEl) textEl.classList.add('hidden');
                } else {
                  if (textEl) {
                    textEl.classList.remove('hidden');
                    textEl.style.display = 'inline-block';
                    textEl.style.visibility = 'visible';
                  }
                }
                currentIsBlankState = false;
              }
            };

            setTimeout(swapContent, cutPoint);

            const endStinger = () => {
              swapContent();
              isStingerActive = false;
              stingerEl.classList.add('hidden');
              stingerEl.style.display = 'none';
            };

            stingerEl.onended = endStinger;
            setTimeout(endStinger, cutPoint + 2000);
          }
        } else if (transType === 'cut') {
          if (isStandbyMode) {
            if (slidesLayer) slidesLayer.classList.add('hidden');
            if (standbyLayer) standbyLayer.classList.remove('hidden');
            if (textEl) textEl.classList.add('hidden');
            updateStandbyMediaDisplay(true);
            currentIsBlankState = true;
          } else {
            if (standbyLayer) standbyLayer.classList.add('hidden');
            if (slidesLayer) slidesLayer.classList.remove('hidden');
            updateStandbyMediaDisplay(false);
            if (isBlankMode || !hasTextContent) {
              if (textEl) textEl.classList.add('hidden');
            } else {
              if (textEl) {
                textEl.classList.remove('hidden');
                textEl.style.display = 'inline-block';
                textEl.style.visibility = 'visible';
              }
            }
            currentIsBlankState = false;
          }
        } else if (transType === 'luma_sinus9' || transType === 'luma_center') {
          const lumaDuration = 1150;
          if (isStandbyMode) {
            updateStandbyMediaDisplay(true);
            runLumaSinusWipe(standbyLayer, lumaDuration, () => {
              if (slidesLayer) slidesLayer.classList.add('hidden');
              if (standbyLayer) standbyLayer.style.zIndex = '6';
            });
            currentIsBlankState = true;
          } else {
            if (standbyLayer) standbyLayer.classList.remove('hidden');
            runLumaSinusWipe(slidesLayer, lumaDuration, () => {
              if (standbyLayer) standbyLayer.classList.add('hidden');
              if (slidesLayer) slidesLayer.style.zIndex = '6';
              updateStandbyMediaDisplay(false);
            });
            currentIsBlankState = false;
          }
        } else {
          // FADE / ZOOM
          const animClass = (transType === 'zoom') ? 'trans-zoom-incoming' : 'trans-fade-incoming';
          const duration = 650;
          if (isStandbyMode) {
            if (standbyLayer) {
              standbyLayer.classList.remove('hidden');
              standbyLayer.classList.add(animClass);
            }
            updateStandbyMediaDisplay(true);
            setTimeout(() => {
              if (slidesLayer) slidesLayer.classList.add('hidden');
              if (standbyLayer) standbyLayer.classList.remove(animClass);
            }, duration);
            currentIsBlankState = true;
          } else {
            if (slidesLayer) {
              slidesLayer.classList.remove('hidden');
              slidesLayer.classList.add(animClass);
            }
            setTimeout(() => {
              if (standbyLayer) standbyLayer.classList.add('hidden');
              if (slidesLayer) slidesLayer.classList.remove(animClass);
              updateStandbyMediaDisplay(false);
            }, duration);
            currentIsBlankState = false;
          }
        }
      } else if (!isStingerActive) {
        // DIRECT SCENE DISPLAY (NO TRANSITION RE-TRIGGER)
        if (isStandbyMode) {
          if (slidesLayer) slidesLayer.classList.add('hidden');
          if (standbyLayer) {
            standbyLayer.classList.remove('hidden');
            standbyLayer.style.zIndex = '6';
          }
          if (textEl) textEl.classList.add('hidden');
          updateStandbyMediaDisplay(true);
          currentIsBlankState = true;
        } else {
          if (standbyLayer) standbyLayer.classList.add('hidden');
          if (slidesLayer) {
            slidesLayer.classList.remove('hidden');
            slidesLayer.style.zIndex = '6';
          }
          updateStandbyMediaDisplay(false);
          if (isBlankMode || !hasTextContent) {
            if (textEl) textEl.classList.add('hidden');
            currentIsBlankState = isBlankMode;
          } else {
            if (textEl) {
              textEl.classList.remove('hidden');
              textEl.style.display = 'inline-block';
              textEl.style.visibility = 'visible';
            }
            currentIsBlankState = false;
          }
        }
      }

      // 5. ROCK-SOLID FLICKER-FREE TEXT RENDERING & POSITIONING
      if (!isBlankMode && !isStandbyMode && hasTextContent && !isStingerActive) {
        const isBible = Boolean(data.isBible || data.is_bible);
        const textKey = `${data.text || ''}_${isBible}_${data.badgeText || ''}_${data.badgeClass || ''}`;
        const textChanged = (currentTextState !== textKey);

        if (textChanged) {
          currentTextState = textKey;
          textEl.innerHTML = formatPresenterText(data.text, isBible, data.badgeText, data.badgeClass);
          fitTextToSafeArea(isBible);

          // ONLY trigger special entrance animation if explicitly configured and not default
          textEl.classList.remove('animate-appear-fade', 'animate-appear-slide', 'animate-appear-drop', 'animate-appear-pop', 'animate-appear-flip', 'animate-appear-glow');
          if (animType && animType !== 'none' && animType !== 'fade') {
            textEl.classList.add(`animate-appear-${animType}`);
          }
        } else {
          fitTextToSafeArea(isBible);
        }

        // Highlight line updates
        if (data.highlightedLines !== undefined) {
          if (!lastStyleData) lastStyleData = {};
          lastStyleData.highlightedLines = data.highlightedLines;
          if (data.highlightColor) lastStyleData.highlightColor = data.highlightColor;
        }

        const hColor = (lastStyleData && lastStyleData.highlightColor) || '#ef4444';
        const activeHighlights = (lastStyleData && lastStyleData.highlightedLines) || [];

        const segments = Array.from(textEl.querySelectorAll('.obs-line-segment'));
        segments.forEach((seg, idx) => {
          const segLineIdx = parseInt(seg.dataset.lineIdx !== undefined ? seg.dataset.lineIdx : idx);
          const isH = Array.isArray(activeHighlights) ? activeHighlights.includes(segLineIdx) : (activeHighlights === segLineIdx);
          if (isH) {
            seg.style.setProperty('--highlight-bg', `${hColor}cc`);
            if (!seg.classList.contains('line-highlighted')) {
              seg.classList.remove('line-unhighlighting');
              seg.classList.add('line-highlighted', 'line-animating');
              setTimeout(() => seg.classList.remove('line-animating'), 650);
            }
          } else {
            seg.classList.remove('line-highlighted', 'line-animating', 'line-unhighlighting');
          }
        });

        // All-In-One real-time smooth scroll
        if (data.mode === 'allinone' || (data.text && data.text.includes('allinone-slide-group'))) {
          const docEl = document.documentElement || document.body;
          const presenterBox = document.getElementById('presenter-box');
          const groups = document.querySelectorAll('.allinone-slide-group');

          if (data.activeGroupIndex === 0 || (!data.activeGroupIndex && data.scrollRatio === 0)) {
            if (presenterBox) presenterBox.scrollTop = 0;
            window.scrollTo({ top: 0, behavior: 'smooth' });
          } else if (data.activeGroupIndex !== undefined && data.activeGroupIndex !== null && groups.length > 0) {
            const targetGroup = document.querySelector(`.allinone-slide-group[data-group-idx="${data.activeGroupIndex}"]`) || groups[data.activeGroupIndex];
            if (targetGroup) {
              targetGroup.scrollIntoView({ block: 'center', behavior: 'smooth' });
            }
          } else if (data.scrollRatio !== undefined && !isNaN(data.scrollRatio)) {
            if (presenterBox) {
              const maxScrollHeight = Math.max(0, presenterBox.scrollHeight - presenterBox.clientHeight);
              if (maxScrollHeight > 0) {
                presenterBox.scrollTop = Math.round(data.scrollRatio * maxScrollHeight);
              }
            }
            const maxWindowScroll = Math.max(0, docEl.scrollHeight - window.innerHeight);
            if (maxWindowScroll > 0) {
              window.scrollTo({ top: Math.round(data.scrollRatio * maxWindowScroll), behavior: 'smooth' });
            }
          }
        }
      }

      // UPDATE FOOTER BAR (SCALE BADGE & SLIDE COUNTER)
      const footerBarEl = document.getElementById('presenter-footer-bar');
      const scaleBadgeEl = document.getElementById('presenter-scale-badge');
      const scaleTextEl = document.getElementById('scale-text');
      const counterBadgeEl = document.getElementById('presenter-slide-counter');
      const counterTextEl = document.getElementById('counter-text');

      if (footerBarEl) {
        let hasFooter = false;
        if (data.scaleText && String(data.scaleText).trim().length > 0 && !data.isBible && !data.is_bible) {
          const cleanScaleText = String(data.scaleText).replace(/\s*\([^)]*\)/g, '').trim();
          if (scaleTextEl) scaleTextEl.textContent = `السلم: ${cleanScaleText}`;
          if (scaleBadgeEl) scaleBadgeEl.classList.remove('hidden');
          hasFooter = true;
        } else if (scaleBadgeEl) {
          scaleBadgeEl.classList.add('hidden');
        }

        if (data.currentSlide && data.totalSlides) {
          if (counterTextEl) counterTextEl.textContent = `${data.currentSlide} من ${data.totalSlides}`;
          if (counterBadgeEl) counterBadgeEl.classList.remove('hidden');
          hasFooter = true;
        } else if (counterBadgeEl) {
          counterBadgeEl.classList.add('hidden');
        }

        if (hasFooter && !data.isBlank) {
          footerBarEl.classList.remove('hidden');
        } else {
          footerBarEl.classList.add('hidden');
        }
      }

      // POSITIONING LOGIC: Black screen mode is strictly locked at center (50%, 50%). Green screen is adjustable.
      const currentChroma = document.body.getAttribute('data-chroma');
      if (currentChroma !== 'green') {
        currentPivot = { xPct: 50, yPct: 50 };
        box.style.left = '50%';
        box.style.top = '50%';
        box.style.transform = 'translate(-50%, -50%)';
        box.style.cursor = 'default';
      } else if (data.pos && !isDragging) {
        let x = data.pos.xPct;
        let y = data.pos.yPct;

        if (x === undefined && data.pos.left !== undefined) {
          x = (data.pos.left / window.innerWidth) * 100;
        }
        if (y === undefined && data.pos.top !== undefined) {
          y = (data.pos.top / window.innerHeight) * 100;
        }

        if (x !== undefined && y !== undefined && !isNaN(x) && !isNaN(y)) {
          currentPivot = { xPct: x, yPct: y };
          box.style.left = x + '%';
          box.style.top = y + '%';
          box.style.transform = 'translate(-50%, -50%)';
          localStorage.setItem('sunday_school_taranim_drag_pivot', JSON.stringify(currentPivot));
        }
      }
    }

    // 1. CEF BACKGROUND OCCLUSION & SLEEP OVERRIDE
    try {
      Object.defineProperty(document, 'hidden', { get: () => false, configurable: true });
      Object.defineProperty(document, 'visibilityState', { get: () => 'visible', configurable: true });
      document.addEventListener('visibilitychange', (e) => { e.stopImmediatePropagation(); }, true);
    } catch(e) {}

    let lastRenderedFingerprint = null;

    function getVisualStateFingerprint(data) {
      if (!data || typeof data !== 'object') return '';
      return [
        data.text || '',
        Boolean(data.isBible || data.is_bible),
        data.badgeText || '',
        data.badgeClass || '',
        data.mode || data.presentationMode || 'oneline',
        data.font || '',
        data.fontSize || 0,
        data.textColor || '',
        data.strokeWidth || 0,
        data.strokeColor || '',
        data.shadowBlur || 0,
        data.shadowColor || '',
        data.shadowDistance || 0,
        data.shadowAngle || 0,
        data.fontWeight || '',
        data.fontStyle || '',
        data.textDecoration || '',
        data.textAlign || '',
        Boolean(data.isJustified),
        data.letterSpacing || 0,
        data.lineHeight || 1.5,
        data.boxBgColor || '',
        data.boxOpacity || 0,
        data.boxRadius || 0,
        data.boxPadding || 0,
        Boolean(data.isBlank),
        Boolean(data.isStandby || data.isStandbyMode),
        data.anim || 'none',
        JSON.stringify(data.slidesBgConfig || {}),
        JSON.stringify(data.standbyConfig || {}),
        JSON.stringify(data.textTransform || {}),
        JSON.stringify(data.highlightedLines || []),
        data.activeGroupIndex || 0,
        data.scrollRatio || 0,
        data.bibleRef || '',
        data.scaleText || '',
        data.currentSlide || 0,
        data.totalSlides || 0,
        Boolean(data.triggerTransition),
        Boolean(data.forceRefresh)
      ].join('||');
    }

    function checkAndApplyLatestState(explicitData = null) {
      try {
        let data = explicitData;

        if (!data) {
          const raw = localStorage.getItem('sunday_school_taranim_live_presentation');
          if (!raw) return;
          data = JSON.parse(raw);
        }

        if (data && typeof data === 'object') {
          lastLocalPayloadTime = Date.now();
          const fingerprint = getVisualStateFingerprint(data);
          if (fingerprint === lastRenderedFingerprint && !data.forceRefresh) {
            return;
          }
          if (data.forceRefresh) {
            currentTextState = null;
            _lastAnimSlideText = null;
            lastRenderedFingerprint = null;
          } else {
            lastRenderedFingerprint = fingerprint;
          }
          applyState(data, 'local');
        }
      } catch(e) {}
    }

    if (channel) {
      channel.onmessage = (event) => {
        if (event.data) {
          checkAndApplyLatestState(event.data);
        }
      };
    }

    window.addEventListener('storage', (e) => {
      if (e.key === 'sunday_school_taranim_live_presentation') {
        checkAndApplyLatestState();
      }
    });

    setInterval(() => {
      checkAndApplyLatestState();
    }, 40);

    const initialLiveRaw = localStorage.getItem('sunday_school_taranim_live_presentation');
    if (initialLiveRaw) {
      checkAndApplyLatestState();
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          if (reg) reg.update();
        }).catch(() => {});
      });
    }

    let isFetching = false;
    let lastFetchStartTime = 0;
    let activeLiveApiUrl = null;

    async function fetchLiveHTTP() {
      // 1. IF WI-FI / INTERNET IS OFF, SILENTLY BYPASS NETWORK FETCH (100% OFFLINE MODE)
      if (navigator.onLine === false) return;

      // 2. IF LOCAL STORAGE / BROADCAST WAS UPDATED IN LAST 10 SECONDS (SAME DEVICE PRESENTER), BYPASS INTERNET HTTP FETCH!
      if (Date.now() - lastLocalPayloadTime < 10000) {
        return;
      }

      // AUTO-HEALING DEADLOCK BREAKER: Reset after 1000ms
      if (isFetching && (Date.now() - lastFetchStartTime > 1000)) {
        isFetching = false;
      }
      if (isFetching || isDragging || (Date.now() - lastDragTime < 1200)) return;
      isFetching = true;
      lastFetchStartTime = Date.now();

      // 800ms abort timeout (was 2000ms) — fail fast, retry fast
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 800);
      const ts = Date.now();

      try {
        let url = activeLiveApiUrl || (getApiUrl() + '?action=live');
        url += (url.includes('?') ? '&' : '?') + '_t=' + ts;

        let res = await fetch(url, { cache: 'no-cache', signal: controller.signal });
        if (res.ok) {
          let data = await res.json();
          if (data && (data.type === 'PRESENT_LINE' || data.text !== undefined)) {
            applyState(data, 'http');
          }
        } else {
          activeLiveApiUrl = null;
          fetchFallbackLive(ts);
        }
      } catch (err) {
        if (!activeLiveApiUrl) {
          fetchFallbackLive(ts);
        } else {
          // Cached URL failed — reset and retry with fallback discovery
          activeLiveApiUrl = null;
        }
      } finally {
        clearTimeout(timeoutId);
        isFetching = false;
      }
    }

    let lastFallbackTime = 0;
    async function fetchFallbackLive(ts) {
      if (Date.now() - lastFallbackTime < 1500) return;
      lastFallbackTime = Date.now();

      const fallbackUrls = [
        'api.php?action=live',
        '../api.php?action=live',
        '/taranim/api.php?action=live',
        '/api.php?action=live'
      ].map(u => u + (u.includes('?') ? '&' : '?') + '_t=' + ts);

      const raceController = new AbortController();
      const raceTimeout = setTimeout(() => raceController.abort(), 800);

      const promises = fallbackUrls.map(url =>
        fetch(url, { cache: 'no-cache', signal: raceController.signal })
          .then(async res => {
            if (res.ok) {
              const data = await res.json();
              if (data && (data.type === 'PRESENT_LINE' || data.text !== undefined)) {
                return { url: url.replace(/[?&]_t=\d+/, ''), data };
              }
            }
            return null;
          })
          .catch(() => null)
      );

      try {
        const results = await Promise.all(promises);
        const winner = results.find(r => r !== null);
        if (winner) {
          raceController.abort();
          activeLiveApiUrl = winner.url;
          applyState(winner.data, 'http');
        }
      } catch(e) {}
      clearTimeout(raceTimeout);
    }

    // WORKER TIMER (80MS TICKS — OPTIMAL FOR MOBILE HOTSPOT & LOCAL DISPLAY SYNC)
    let workerTimer = null;
    try {
      const workerBlob = new Blob([
        "let t = null; onmessage = function(e) { if (e.data === 'start') { clearInterval(t); t = setInterval(function() { postMessage('tick'); }, 80); } else if (e.data === 'stop') { clearInterval(t); } };"
      ], { type: 'application/javascript' });
      workerTimer = new Worker(URL.createObjectURL(workerBlob));
      workerTimer.onmessage = function() { fetchLiveHTTP(); };
      workerTimer.postMessage('start');
    } catch (e) {
      setInterval(fetchLiveHTTP, 80);
    }

    // INITIALIZE INSTANTLY FROM LOCAL STORAGE SETTINGS / LIVE PAYLOAD ON STARTUP
    (function initSavedState() {
      try {
        const savedLive = localStorage.getItem('sunday_school_taranim_live_presentation');
        if (savedLive) {
          const parsedLive = JSON.parse(savedLive);
          applyState(parsedLive, 'local');
        } else {
          const savedSettings = localStorage.getItem('sunday_school_taranim_style_settings');
          if (savedSettings) {
            const parsedSettings = JSON.parse(savedSettings);
            applyState(parsedSettings, 'local');
          }
        }
      } catch(e) {}
    })();

    // IMMEDIATE RE-FETCH ON VISIBILITY OR FOCUS RESTORATION
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H' || e.key === 'ا') {
        document.body.classList.toggle('controls-hidden');
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') fetchLiveHTTP();
    });
    window.addEventListener('focus', fetchLiveHTTP);
    window.addEventListener('online', fetchLiveHTTP);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }

    // STEALTH POPOUT WINDOW ENGINE
    (function initStealthMode() {
      const urlParams = new URLSearchParams(window.location.search);
      const isStealthParam = urlParams.has('stealth');
      const stealthBar = document.getElementById('stealth-control-bar');

      if (isStealthParam && stealthBar) {
        stealthBar.classList.remove('hidden');
      }

      window.addEventListener('keydown', (e) => {
        if (e.key === 's' || e.key === 'S' || e.key === 'س') {
          if (stealthBar) stealthBar.classList.toggle('hidden');
        }
      });

      const btnToggleMiniStealth = document.getElementById('btn-toggle-mini-stealth');
      const miniStealthTxt = document.getElementById('mini-stealth-txt');
      let isMiniStealth = false;

      if (btnToggleMiniStealth) {
        btnToggleMiniStealth.addEventListener('click', () => {
          isMiniStealth = !isMiniStealth;
          document.body.classList.toggle('is-mini-stealth', isMiniStealth);
          if (isMiniStealth) {
            try { window.resizeTo(340, 200); } catch(err) {}
            if (miniStealthTxt) miniStealthTxt.textContent = 'تكبير النافذة';
          } else {
            try { window.resizeTo(640, 360); } catch(err) {}
            if (miniStealthTxt) miniStealthTxt.textContent = 'تصغير خفي';
          }
        });
      }

      const btnToggleStealthChroma = document.getElementById('btn-toggle-stealth-chroma');
      if (btnToggleStealthChroma) {
        btnToggleStealthChroma.addEventListener('click', () => {
          const currentChroma = document.body.getAttribute('data-chroma') || 'black';
          const nextChroma = currentChroma === 'black' ? 'green' : (currentChroma === 'green' ? 'transparent' : 'black');
          document.body.setAttribute('data-chroma', nextChroma);
        });
      }

      const btnHideStealthBar = document.getElementById('btn-hide-stealth-bar');
      if (btnHideStealthBar && stealthBar) {
        btnHideStealthBar.addEventListener('click', () => {
          stealthBar.classList.add('hidden');
        });
      }
    })();
  </script>
</body>
</html>
