  <style>

    /* MAGNETIC SNAP GUIDES */
    .snap-guide {
      position: absolute;
      z-index: 50;
      pointer-events: none;
      border-color: #f59e0b;
      box-shadow: 0 0 10px #f59e0b;
    }

    .snap-guide.vertical {
      top: 0;
      bottom: 0;
      left: 50%;
      border-left: 2px dashed #f59e0b;
    }

    .snap-guide.horizontal {
      left: 0;
      right: 0;
      top: 50%;
      border-top: 2px dashed #f59e0b;
    }

    .lower-third-container {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: 96vw;
      height: 90vh;
      max-width: 96vw;
      max-height: 90vh;
      text-align: center;
      padding: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 0 auto;
      overflow: visible;
      cursor: grab;
    }

    .line-text {
      display: block;
      font-size: 54px;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.35;

      overflow: visible;
      word-break: keep-all;
      overflow-wrap: break-word;
      text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95);
      will-change: transform, opacity;
      transform: translateZ(0);
      backface-visibility: hidden;

    @media (min-width: 769px) and (orientation: landscape) {

    /* TEXT APPEARANCE ANIMATIONS FOR CONTAINER (WITH MOBILE SAFARI WEBKIT COMPATIBILITY) */
    /* HIGH-PERFORMANCE 60FPS GPU ACCELERATED TEXT APPEARANCE ANIMATIONS */
    /* NOTE: In present.html, animation is applied to the CONTAINER box which uses translate(-50%,-50%) for centering */
    @-webkit-keyframes textAppearSlide {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, calc(-50% + 25px), 0) scale3d(0.96, 0.96, 1);
        transform: translate3d(-50%, calc(-50% + 25px), 0) scale3d(0.96, 0.96, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @keyframes textAppearSlide {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, calc(-50% + 25px), 0) scale3d(0.96, 0.96, 1);
        transform: translate3d(-50%, calc(-50% + 25px), 0) scale3d(0.96, 0.96, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @-webkit-keyframes textAppearDrop {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, calc(-50% - 25px), 0) scale3d(0.96, 0.96, 1);
        transform: translate3d(-50%, calc(-50% - 25px), 0) scale3d(0.96, 0.96, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @keyframes textAppearDrop {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, calc(-50% - 25px), 0) scale3d(0.96, 0.96, 1);
        transform: translate3d(-50%, calc(-50% - 25px), 0) scale3d(0.96, 0.96, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @-webkit-keyframes textAppearPop {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(0.85, 0.85, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(0.85, 0.85, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @keyframes textAppearPop {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(0.85, 0.85, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(0.85, 0.85, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @-webkit-keyframes textAppearFlip {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(-45deg);
        transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(-45deg);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(0deg);
        transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(0deg);
      }
    }

    @keyframes textAppearFlip {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(-45deg);
        transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(-45deg);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(0deg);
        transform: translate3d(-50%, -50%, 0) perspective(600px) rotateX(0deg);
      }
    }

    @-webkit-keyframes textAppearGlow {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1.06, 1.06, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1.06, 1.06, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    @keyframes textAppearGlow {
      0% {
        opacity: 0;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1.06, 1.06, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1.06, 1.06, 1);
      }
      100% {
        opacity: 1;
        -webkit-transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
        transform: translate3d(-50%, -50%, 0) scale3d(1, 1, 1);
      }
    }

    .animate-appear-slide {
      -webkit-animation: textAppearSlide 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      animation: textAppearSlide 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      will-change: transform, opacity;
    }

    .animate-appear-drop {
      -webkit-animation: textAppearDrop 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      animation: textAppearDrop 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;
      will-change: transform, opacity;
    }

    .animate-appear-pop {
      -webkit-animation: textAppearPop 0.14s cubic-bezier(0.2, 0.9, 0.3, 1) forwards !important;

    .animate-appear-flip {

    .animate-appear-glow {

    /* Sleek bottom footer info bar for presenter display - NO BACKGROUND OVERLAY */
    .presenter-footer-bar {
      position: fixed;
      bottom: 12px;
      right: 14px !important;
      left: auto !important;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      pointer-events: none;
      z-index: 999;
      direction: rtl;
      font-family: 'Baloo Bhaijaan 2', 'Alexandria', sans-serif;
    }

    .presenter-scale-badge,
    .presenter-slide-counter {
      background: transparent !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
      border: none !important;
      color: rgba(255, 255, 255, 0.55) !important;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0;
      border-radius: 0;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: none !important;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.8);
      letter-spacing: 0.3px;
    }

    /* HIDE CONTROLS MODE */
    body.controls-hidden #btn-close-window-bottom,
    body.controls-hidden .btn-close-overlay-left,
    body.controls-hidden #presenter-footer-bar,
    body.controls-hidden #presenter-slide-counter,
    body.controls-hidden .obs-top-left-header {
      display: none !important;
      opacity: 0 !important;
      pointer-events: none !important;
    }

    .obs-top-left-header {
      position: absolute;
      top: 1.8rem;
      left: 2.2rem;
      color: rgba(255, 255, 255, 0.75);
      font-size: 1.5rem;
      font-weight: 800;
      z-index: 100;
      letter-spacing: 0.5px;
      pointer-events: none;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.85);
      font-family: inherit;
    }

    .badge-num,
    .verse-num,
    .chorus-num {
      display: inline-block;
      font-weight: 700;
      font-size: 0.72em !important;
      margin: 0 4px;
      line-height: 1;
    }

    .verse-num,
    .chorus-num {
      color: #ef4444 !important;
    }

    .rep-num-grey,
    .repeat-tag {
      display: inline-block;
      font-weight: 700;
      font-size: 0.72em !important;
      margin: 0 4px;
      opacity: 0.85;
      color: #94a3b8 !important;
    }

    /* LIVE SLIDE LINE HIGHLIGHT STYLES FOR PRESENTER WINDOW */
    .obs-line-row {
      display: block;
      width: 100%;
      text-align: center;
      margin: 0.12em 0;
    }

    .obs-line-segment {
      position: relative;
      display: inline-block;
      transition: color 0.25s ease;
    }

    .obs-line-segment.line-highlighted {
      position: relative;
      z-index: 5;
      color: #ffffff !important;
      text-shadow: none !important;
      transform: none !important;
      font-size: inherit !important;
      font-weight: inherit !important;
    }

    .obs-line-segment.line-highlighted::before {
      content: '';
      position: absolute;
      inset: 15% 0% 8% 0%;
      background: var(--highlight-bg, rgba(245, 158, 11, 0.82));
      border-radius: 4px;
      z-index: -1;
      box-shadow: none !important;
      animation: highlightLinearWipe 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      will-change: clip-path, opacity;
    }

    @keyframes highlightLinearWipe {
      0% {
        clip-path: polygon(100% 0, 100% 0, 100% 100%, 100% 100%);
        opacity: 0;
      }
      100% {
        clip-path: polygon(0 0, 100% 0, 100% 100%, 0 100%);
        opacity: 1;
      }
    }

    .obs-line-segment.line-unhighlighting::before {
      animation: highlightFadeOut 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes highlightFadeOut {
      0% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    .hidden { display: none !important; }
  </style>

<body data-chroma="black">

  <!-- TOP-LEFT BIBLE / CHAPTER REFERENCE HEADER -->
  <div id="obs-top-left-header" class="obs-top-left-header hidden"></div>

  <!-- MAGNETIC SNAP GUIDES -->
  <div id="snap-guide-h" class="snap-guide horizontal hidden"></div>
  <div id="snap-guide-v" class="snap-guide vertical hidden"></div>

  <div class="lower-third-container" id="presenter-box">
    <div id="standby-branding" class="standby-branding">
      <img src="logo_tw.png" alt="Sunday School Logo" class="standby-logo">
    </div>
    <div class="line-text hidden" id="presenter-text"></div>
  </div>

  <!-- PRESENTATION FOOTER BAR (SLIDE COUNTER) -->
  <div id="presenter-footer-bar" class="presenter-footer-bar hidden">
    <div id="presenter-slide-counter" class="presenter-slide-counter hidden">
      <span id="counter-text"></span>
    </div>
  </div>

  <!-- SLEEK ICON EXIT BUTTON AT LEFT END -->
  <button id="btn-close-window-bottom" class="btn-close-overlay-left" onclick="closePresentationWindow(event)" title="إغلاق النافذة (Esc)">
    <i class="fa-solid fa-xmark"></i>
  </button>

  <script>
    function updateFullscreenBtnIcon() {
      const btn = document.getElementById('btn-close-window-bottom');
      if (!btn) return;
      const isFS = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      if (isFS) {
        btn.innerHTML = `<i class="fa-solid fa-xmark"></i>`;
        btn.title = 'إنهاء ملء الشاشة (Esc)';
      } else {
        btn.innerHTML = `<i class="fa-solid fa-expand"></i>`;
        btn.title = 'ملء الشاشة';
      }
    }

    document.addEventListener('fullscreenchange', updateFullscreenBtnIcon);
    document.addEventListener('webkitfullscreenchange', updateFullscreenBtnIcon);
    document.addEventListener('DOMContentLoaded', updateFullscreenBtnIcon);

    function closePresentationWindow(e) {
      if (e) {
        if (typeof e.preventDefault === 'function') e.preventDefault();
        if (typeof e.stopPropagation === 'function') e.stopPropagation();
      }

      const isFS = Boolean(document.fullscreenElement || document.webkitFullscreenElement);
      if (!isFS) {
        // Not in fullscreen -> enter fullscreen
        if (document.documentElement.requestFullscreen) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else if (document.documentElement.webkitRequestFullscreen) {
          document.documentElement.webkitRequestFullscreen();
        }
      } else {
        // In fullscreen -> exit fullscreen
        if (document.exitFullscreen) {
          document.exitFullscreen().catch(() => {});
        } else if (document.webkitExitFullscreen) {
          try { document.webkitExitFullscreen(); } catch(err) {}
        }
      }
      setTimeout(updateFullscreenBtnIcon, 150);
    }
    const box = document.getElementById('presenter-box');
    const textEl = document.getElementById('presenter-text');
    const standbyEl = document.getElementById('standby-branding');
    const guideV = document.getElementById('snap-guide-v');
    const guideH = document.getElementById('snap-guide-h');

    let stateFontSize = 54;
    let lastDragTime = 0;

    function requestAutoFullscreen() {
      if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    }

    window.addEventListener('load', () => { setTimeout(requestAutoFullscreen, 100); });
    window.addEventListener('click', requestAutoFullscreen);
    window.addEventListener('touchstart', requestAutoFullscreen);
    window.addEventListener('pointerdown', requestAutoFullscreen);
    window.addEventListener('focus', requestAutoFullscreen);
    window.addEventListener('keydown', requestAutoFullscreen);

    const urlParams = new URLSearchParams(window.location.search);
    let initialChroma = urlParams.get('chroma');
    if (!initialChroma) {
      try {
        const savedLiveRaw = localStorage.getItem('sunday_school_taranim_live_presentation');
        if (savedLiveRaw) {
          const parsed = JSON.parse(savedLiveRaw);
          if (parsed && (parsed.chroma || parsed.chromaKey)) {
            initialChroma = parsed.chroma || parsed.chromaKey;
          }
        }
        if (!initialChroma) {
          const savedStyleRaw = localStorage.getItem('sunday_school_taranim_style_settings');
          if (savedStyleRaw) {
            const parsedStyle = JSON.parse(savedStyleRaw);
            if (parsedStyle && parsedStyle.chromaKey) {
              initialChroma = parsedStyle.chromaKey;
            }
          }
        }
      } catch(e) {}
    }
    if (!initialChroma) {
      initialChroma = 'black';
    }
    document.body.setAttribute('data-chroma', initialChroma);

    const screenLeft = urlParams.get('screenLeft');
    const screenTop = urlParams.get('screenTop');
    const screenIdx = urlParams.get('screenIdx');
    const isAutoFS = urlParams.get('autofs') === 'true';

    function applyDynamicShadow(newData) {
      if (newData) {

      }
      const data = lastStyleData;
      
      const currentFontSize = parseFloat(textEl.style.fontSize) || data.fontSize || stateFontSize || 54;
      const scale = currentFontSize / 50;

      const strokeWidth = parseInt(data.strokeWidth || 0);
      const strokeColor = data.strokeColor || '#000000';

      const angleDeg = (data && data.shadowAngle !== undefined) ? data.shadowAngle : 90;
      const distPx = (data && data.shadowDistance !== undefined) ? data.shadowDistance : 6;
      const shadowBlur = (data && data.shadowBlur !== undefined) ? data.shadowBlur : 12;
      const shadowColor = (data && data.shadowColor) ? data.shadowColor : '#000000';

      const rad = (angleDeg || 90) * Math.PI / 180;
      const offX = Math.round(distPx * Math.cos(rad));
      const offY = Math.round(distPx * Math.sin(rad));

      textEl.style.paintOrder = 'stroke fill markers';
      textEl.style.webkitPaintOrder = 'stroke fill markers';

      let shadowParts = [];
      if (strokeWidth > 0) {
        const s = Math.max(1, Math.round(strokeWidth * scale * 1.2));
        textEl.style.webkitTextStroke = `${s}px ${strokeColor}`;
        textEl.style.textStroke = `${s}px ${strokeColor}`;
        
        for (let angle = 0; angle < 360; angle += 22.5) {
          const rA = angle * Math.PI / 180;
          const sx = (s * Math.cos(rA)).toFixed(1);
          const sy = (s * Math.sin(rA)).toFixed(1);
          shadowParts.push(`${sx}px ${sy}px 0 ${strokeColor}`);
        }
      } else {

        textEl.style.textStroke = '0px transparent';
      }

      if (shadowBlur > 0 || distPx > 0) {

      }

    }

    let currentIsBible = false;

    function fitTextToSafeArea(isBible = currentIsBible) {

      currentIsBible = isBible;
      let baseSize = (lastStyleData && lastStyleData.fontSize) || stateFontSize || 54;
      const scaleMode = (lastStyleData && lastStyleData.scaleMode) || 'auto';
      const container = document.getElementById('obs-overlay-container') || document.body;
      const maxH = (container.clientHeight || window.innerHeight) * 0.88;
      const maxW = (container.clientWidth || window.innerWidth) * 0.94;

      const segments = Array.from(textEl.querySelectorAll('.obs-line-segment'));
      const currentFont = (lastStyleData && lastStyleData.font) || textEl.style.fontFamily || '';
      const isJomhuria = /jomhuria/i.test(currentFont);

      const align = (lastStyleData && lastStyleData.textAlign) || textEl.style.textAlign || 'center';
      const lSpacing = (lastStyleData && lastStyleData.letterSpacing !== undefined) ? lastStyleData.letterSpacing : 0;
      const lHeight = (lastStyleData && lastStyleData.lineHeight !== undefined) ? lastStyleData.lineHeight : 1.5;
      const fWeight = (lastStyleData && lastStyleData.fontWeight) || '400';
      const fStyle = (lastStyleData && lastStyleData.fontStyle) || 'normal';
      const tDeco = (lastStyleData && lastStyleData.textDecoration) || 'none';

      if (align === 'justify' && !isJomhuria) {
        textEl.style.textAlign = 'justify';
        textEl.style.textJustify = 'kashida';
        textEl.style.textAlignLast = 'justify';
      } else {
        textEl.style.textAlign = align === 'justify' ? 'center' : align;
        textEl.style.textJustify = 'auto';
        textEl.style.textAlignLast = align === 'justify' ? 'center' : align;
      }
      textEl.style.fontStyle = fStyle;
      textEl.style.textDecoration = tDeco;

      segments.forEach(s => {
        if (align === 'justify' && !isJomhuria) {
          s.style.whiteSpace = 'normal';
          s.style.wordBreak = 'break-word';
          s.style.display = 'block';
          s.style.width = '100%';
          s.style.textAlign = 'justify';
          s.style.textJustify = 'kashida';

        } else {
          s.style.whiteSpace = 'nowrap';
          s.style.wordBreak = 'keep-all';
          s.style.overflowWrap = 'normal';
          s.style.textAlign = align;
        }
      });

      // Apply Font & Typography Metrics BEFORE Binary Search so measurements reflect real font bounds
      if (isJomhuria) {
        textEl.style.fontFamily = 'Jomhuria, Arial, sans-serif';
        textEl.style.lineHeight = `${lHeight || 1.25}`;
        textEl.style.letterSpacing = `${lSpacing || 2}px`;
        textEl.style.wordSpacing = '6px';
        textEl.style.fontWeight = fWeight || '400';
      } else {
        textEl.style.fontFamily = currentFont || 'sans-serif';
        textEl.style.lineHeight = `${lHeight || 1.5}`;
        textEl.style.letterSpacing = `${lSpacing}px`;
        textEl.style.wordSpacing = 'normal';
        textEl.style.fontWeight = fWeight;
      }

      let renderSize = baseSize;

      if (scaleMode === 'auto') {
        const isVertical = window.innerHeight > window.innerWidth;
        const refTargetW = isVertical ? Math.max(maxW, maxH * (16 / 9)) : maxW;

        let low = 16;
        let maxLimit = isJomhuria ? 300 : 260;
        let high = Math.min(maxLimit, Math.max(120, Math.floor(maxH / Math.max(1, (segments.length || 1) * 0.85))));

        textEl.style.whiteSpace = 'nowrap';
        textEl.style.maxWidth = 'none';

          const w = textEl.scrollWidth || textEl.offsetWidth;

    (async function detectScreens() {

          const sIdx = screenIdx !== null ? parseInt(screenIdx) : -1;
          if (details && details.screens && sIdx >= 0 && details.screens[sIdx]) {

          } else if (details && details.screens && details.screens.length > 1) {
            _targetScreen = details.screens.find(s => !s.isPrimary) || details.screens[1];

    })();

    async function requestAutoFullscreen(e) {
      if (document.fullscreenElement) return;
      if (e && e.target && e.target.closest && e.target.closest('#btn-close-window-bottom, .btn-close-overlay-left')) return;

      // First interaction: request screen permission if not yet granted
      if (!_screenDetailsReady && 'getScreenDetails' in window) {
        try {
          const details = await window.getScreenDetails();
          const sIdx = screenIdx !== null ? parseInt(screenIdx) : -1;
          if (details && details.screens && sIdx >= 0 && details.screens[sIdx]) {
            _targetScreen = details.screens[sIdx];
          } else if (details && details.screens && details.screens.length > 1) {

          }

        } catch(e) { _screenDetailsReady = true; }

    // DRAGGING LOGIC (ONLY ENABLED IN GREEN SCREEN CHROMA MODE)
    let isDragging = false;
    let dragStartX = 0;
    let dragStartY = 0;
    let initialXPct = 50;
    let initialYPct = 75;
    const SNAP_THRESHOLD = 22;

    box.addEventListener('mousedown', (e) => {
      // ONLY ALLOW DRAGGING IN GREEN SCREEN MODE
      const currentChroma = document.body.getAttribute('data-chroma');
      if (currentChroma !== 'green') {

      const currentChroma = document.body.getAttribute('data-chroma');

        if (guideH) guideH.classList.add('hidden');

      const screenH = window.innerHeight;

      const deltaYPixels = e.clientY - dragStartY;

      let targetY = (initialYPct / 100 * screenH) + deltaYPixels;

      let snappedV = false;
      let snappedH = false;

      if (Math.abs(targetX - screenW / 2) < SNAP_THRESHOLD) {
        targetX = screenW / 2;
        snappedV = true;
      }

      if (Math.abs(targetY - screenH / 2) < SNAP_THRESHOLD) {
        targetY = screenH / 2;
        snappedH = true;

      else if (guideV) guideV.classList.add('hidden');

      if (snappedH && guideH) guideH.classList.remove('hidden');
      else if (guideH) guideH.classList.add('hidden');

      currentPivot.yPct = (targetY / screenH) * 100;

      box.style.top = currentPivot.yPct + '%';

    function getApiUrl() {

      if (path.endsWith('.html') || path.endsWith('.php')) {
        return path.substring(0, path.lastIndexOf('/') + 1) + 'api.php';
      }
      if (!path.endsWith('/')) path += '/';
      return path + 'api.php';
    }

          fetch('api.php?action=live', { method: 'POST', headers, body: postBody }).catch(() => {
            fetch('../api.php?action=live', { method: 'POST', headers, body: postBody }).catch(() => {});

        });

    });

    function formatPresenterText(rawText, isBible = false, badgeTextOverride = '', badgeClassOverride = '') {
      if (!rawText) return '';

      let text = String(rawText);
      let detectedBadge = badgeTextOverride || '';
      let detectedBadgeClass = badgeClassOverride || '';

      if (!detectedBadge) {
        const badgeMatch = text.match(/^\s*\(?(ق|قرار|\d+|[٠-٩]+)\)?[:\s\-]*\s*/i);
        if (badgeMatch) {
          const isChorus = /ق|قرار/i.test(badgeMatch[1]);
          detectedBadge = isChorus ? '(ق)' : `(${badgeMatch[1]})`;
          detectedBadgeClass = isChorus ? 'chorus-badge-side chorus-num' : 'stanza-badge-side verse-num';
          text = text.replace(/^\s*\(?(ق|قرار|\d+|[٠-٩]+)\)?[:\s\-]*\s*/i, '').trim();
        }
      } else {
        const isChorus = /ق|قرار/i.test(detectedBadge);
        if (isChorus) {
          detectedBadge = '(ق)';
          detectedBadgeClass = 'chorus-badge-side chorus-num';
        }
        text = text.replace(/^\s*\(?(ق|قرار|\d+|[٠-٩]+)\)?[:\s\-]*\s*/i, '').trim();
      }

      let html = text
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

      let lines = html.split('\n');

      let badgeHtml = '';
      if (detectedBadge) {
        badgeHtml = `<span class="slide-badge-layer ${detectedBadgeClass}">${detectedBadge}</span>`;
      }

      const isJomhuria = /jomhuria/i.test((lastStyleData && lastStyleData.font) || '');
      let isJustify = lastStyleData && lastStyleData.textAlign === 'justify' && !isJomhuria;
      const connectableRegex = /([\u0628\u062A\u062B\u062C\u062D\u062E\u0633\u0634\u0635\u0636\u0637\u0638\u0639\u063A\u0641\u0642\u0643\u0644\u0645\u0646\u0647\u064A\u0649])(?=[\u0600-\u06FF])/g;

      let lineSegments = lines.map((l, idx) => {
        let lineStr = l.trim();
        if (!lineStr) return '';
        if (isJustify && /[\u0600-\u06FF]/.test(lineStr)) {
          lineStr = lineStr.replace(connectableRegex, '$1ـ');
        }
        if (lineStr.startsWith('(')) {
          lineStr = '<span class="rep-num-grey" style="color:#94a3b8; font-weight:600; margin-left:1px;">(</span>' + lineStr.substring(1);
        }
        lineStr = lineStr.replace(/\)([\d٠-٩]*)$/, '<span class="rep-num-grey" style="color:#94a3b8; font-weight:600; margin-right:1px;">)$1</span>');

        if (idx === 0) {
          return `<div class="obs-line-row"><span class="obs-line-segment obs-first-line" data-line-idx="0"><span class="obs-first-line-wrapper">${badgeHtml}${lineStr}</span></span></div>`;
        }
        return `<div class="obs-line-row"><span class="obs-line-segment" data-line-idx="${idx}">${lineStr}</span></div>`;
      }).filter(Boolean).join('');

      return `<div class="obs-slide-wrapper" style="overflow: visible;"><div class="obs-lines-wrapper" style="overflow: visible;">${lineSegments}</div></div>`;
    }

    function applyState(data, source = 'local') {
      if (!data || typeof data !== 'object') return;

      // TIMESTAMP DEDUPLICATION: Ignore stale server/HTTP payloads if a newer local message was already rendered
      if (data.updatedAt && (source === 'server' || source === 'http')) {
        if (data.updatedAt < lastProcessedTimestamp) {
          return;

      if (data.updatedAt) {
        lastProcessedTimestamp = data.updatedAt;

      const textEl = document.getElementById('presenter-text');
      const box = document.getElementById('presenter-box');
      const standbyEl = document.getElementById('standby-branding');
      const animType = data.anim || 'fade';

      if (!textEl || !box) return;

      const incomingChroma = data.chroma || data.chromaKey;
      if (incomingChroma) {
        document.body.setAttribute('data-chroma', incomingChroma);
      }

      const customFontUrl = data.customFontDataUrl || localStorage.getItem('sunday_school_custom_font_dataurl');
      const customFontName = data.customFontName || localStorage.getItem('sunday_school_custom_font_name');
      if (customFontUrl && customFontName) {
        let fontStyleEl = document.getElementById('custom-uploaded-font-style-obs');
        if (!fontStyleEl) {
          fontStyleEl = document.createElement('style');
          fontStyleEl.id = 'custom-uploaded-font-style-obs';
          document.head.appendChild(fontStyleEl);
        }
        fontStyleEl.textContent = `@font-face { font-family: "${customFontName}"; src: url("${customFontUrl}"); }`;
      }

      if (data.font) {
        textEl.style.fontFamily = data.font;
      }

      if (data.fontSize) {
        stateFontSize = data.fontSize;
      }

      if (!lastStyleData) lastStyleData = {};
      if (data.font) lastStyleData.font = data.font;
      if (data.textAlign) lastStyleData.textAlign = data.textAlign;
      if (data.letterSpacing !== undefined) lastStyleData.letterSpacing = data.letterSpacing;
      if (data.lineHeight !== undefined) lastStyleData.lineHeight = data.lineHeight;
      if (data.fontWeight) lastStyleData.fontWeight = data.fontWeight;
      if (data.fontStyle) lastStyleData.fontStyle = data.fontStyle;
      if (data.textDecoration) lastStyleData.textDecoration = data.textDecoration;

      if (data.fontWeight) textEl.style.fontWeight = data.fontWeight;
      if (data.fontStyle) textEl.style.fontStyle = data.fontStyle;
      if (data.textDecoration) textEl.style.textDecoration = data.textDecoration;
      if (data.textAlign) {
        textEl.style.textAlign = data.textAlign;
        box.style.textAlign = data.textAlign;
      }
      if (data.letterSpacing !== undefined) textEl.style.letterSpacing = `${data.letterSpacing}px`;
      if (data.lineHeight !== undefined) textEl.style.lineHeight = data.lineHeight;

      if (data.boxOpacity !== undefined && data.boxOpacity > 0) {
        const hex = data.boxBgColor || '#000000';
        const r = parseInt(hex.slice(1, 3), 16) || 0;
        const g = parseInt(hex.slice(3, 5), 16) || 0;
        const b = parseInt(hex.slice(5, 7), 16) || 0;
        const alpha = data.boxOpacity / 100;
        box.style.background = `rgba(${r}, ${g}, ${b}, ${alpha})`;
      } else {
        box.style.background = 'transparent';
      }

      if (data.boxRadius !== undefined) box.style.borderRadius = `${data.boxRadius}px`;
      if (data.boxPadding !== undefined) box.style.padding = `${data.boxPadding}px`;

      const textColor = data.textColor || '#ffffff';
      textEl.style.color = textColor;

      applyDynamicShadow(data);

      const blankOverlayEl = document.getElementById('blank-screen-overlay');
      if (blankOverlayEl) {
        blankOverlayEl.classList.toggle('hidden', !data.isBlank);
      }

      if (data.hideControls !== undefined) {
        document.body.classList.toggle('controls-hidden', Boolean(data.hideControls));
      }

      const topLeftHeaderEl = document.getElementById('obs-top-left-header');
      if (topLeftHeaderEl) {
        if (data.bibleRef && !data.isBlank) {
          topLeftHeaderEl.textContent = data.bibleRef;
          topLeftHeaderEl.classList.remove('hidden');
        } else {
          topLeftHeaderEl.classList.add('hidden');
        }
      }

      const hasText = Boolean(data.text && String(data.text).trim() && !data.isBlank);

      if (!hasText) {
        textEl.classList.add('hidden');
        textEl.style.display = 'none';
        if (standbyEl) standbyEl.classList.remove('hidden');
        currentIsBlankState = true;
      } else {
        if (standbyEl) standbyEl.classList.add('hidden');
        textEl.classList.remove('hidden');
        textEl.style.display = 'inline-block';
        textEl.style.visibility = 'visible';
        const isBible = Boolean(data.isBible || data.is_bible);
        textEl.innerHTML = formatPresenterText(data.text, isBible, data.badgeText, data.badgeClass);
        fitTextToSafeArea(isBible);

        // HIGHLIGHT LINE LOGIC (LINEAR WIPE & FADE OUT) AFTER TEXT & FIT ARE APPLIED
        if (data.highlightedLines !== undefined) {
          if (!lastStyleData) lastStyleData = {};
          lastStyleData.highlightedLines = data.highlightedLines;
          if (data.highlightColor) lastStyleData.highlightColor = data.highlightColor;
        }

        const hColor = (lastStyleData && lastStyleData.highlightColor) || '#f59e0b';
        const activeHighlights = (lastStyleData && lastStyleData.highlightedLines) || [];

        const segments = Array.from(textEl.querySelectorAll('.obs-line-segment'));
        segments.forEach((seg, idx) => {
          const segLineIdx = parseInt(seg.dataset.lineIdx !== undefined ? seg.dataset.lineIdx : idx);
          const isH = Array.isArray(activeHighlights) ? activeHighlights.includes(segLineIdx) : (activeHighlights === segLineIdx);
          if (isH) {
            seg.style.setProperty('--highlight-bg', `${hColor}cc`);
            seg.classList.remove('line-unhighlighting');
            seg.classList.add('line-highlighted');
          } else {
            if (seg.classList.contains('line-highlighted')) {
              seg.classList.remove('line-highlighted');
              seg.classList.add('line-unhighlighting');
              setTimeout(() => seg.classList.remove('line-unhighlighting'), 300);
            }
          }
        });

        if (currentTextState !== data.text || currentAnimState !== animType) {
          currentTextState = data.text;
          currentAnimState = animType;

          box.classList.remove('animate-appear-slide', 'animate-appear-drop', 'animate-appear-pop', 'animate-appear-flip', 'animate-appear-glow');
          textEl.classList.remove('animate-appear-slide', 'animate-appear-drop', 'animate-appear-pop', 'animate-appear-flip', 'animate-appear-glow');

          if (animType !== 'none' && data.text) {
            void box.offsetWidth;
            box.classList.add(`animate-appear-${animType}`);
          }
        }
        currentIsBlankState = false;
      }

      // UPDATE FOOTER BAR (SCALE BADGE & SLIDE COUNTER)
      const footerBarEl = document.getElementById('presenter-footer-bar');
      const scaleBadgeEl = document.getElementById('presenter-scale-badge');
      const scaleTextEl = document.getElementById('scale-text');
      const counterBadgeEl = document.getElementById('presenter-slide-counter');
      const counterTextEl = document.getElementById('counter-text');

      if (footerBarEl) {
        let hasFooter = false;
        if (data.scaleText) {
          if (scaleTextEl) scaleTextEl.textContent = `السلم: ${data.scaleText}`;
          if (scaleBadgeEl) scaleBadgeEl.classList.remove('hidden');
          hasFooter = true;
        } else if (scaleBadgeEl) {
          scaleBadgeEl.classList.add('hidden');
        }

        if (data.currentSlide && data.totalSlides) {
          if (counterTextEl) counterTextEl.textContent = `${data.currentSlide} من ${data.totalSlides}`;
          if (counterBadgeEl) counterBadgeEl.classList.remove('hidden');
          hasFooter = true;
        } else if (counterBadgeEl) {
          counterBadgeEl.classList.add('hidden');
        }

        if (hasFooter && !data.isBlank) {
          footerBarEl.classList.remove('hidden');
        } else {
          footerBarEl.classList.add('hidden');
        }
      }

      // POSITIONING LOGIC: Black screen mode is strictly locked at center (50%, 50%). Green screen is adjustable.
      const currentChroma = document.body.getAttribute('data-chroma');
      if (currentChroma !== 'green') {
        currentPivot = { xPct: 50, yPct: 50 };
        box.style.left = '50%';
        box.style.top = '50%';
        box.style.transform = 'translate(-50%, -50%)';
        box.style.cursor = 'default';
      } else if (data.pos && !isDragging) {
        let x = data.pos.xPct;
        let y = data.pos.yPct;

        if (x === undefined && data.pos.left !== undefined) {
          x = (data.pos.left / window.innerWidth) * 100;
        }
        if (y === undefined && data.pos.top !== undefined) {
          y = (data.pos.top / window.innerHeight) * 100;
        }

        if (x !== undefined && y !== undefined && !isNaN(x) && !isNaN(y)) {
          currentPivot = { xPct: x, yPct: y };
          box.style.left = x + '%';
          box.style.top = y + '%';
          box.style.transform = 'translate(-50%, -50%)';
          localStorage.setItem('sunday_school_taranim_drag_pivot', JSON.stringify(currentPivot));
        }
      }
    }

      let lastLocalPayloadTime = 0;

      if (channel) {
        channel.onmessage = (event) => {
          if (event.data && event.data.updatedAt) lastLocalPayloadTime = event.data.updatedAt;
          applyState(event.data, 'local');
        };
      }

    window.addEventListener('storage', (e) => {
      if (e.key === 'sunday_school_taranim_live_presentation') {
        try {
          const data = JSON.parse(e.newValue);
          if (data && data.updatedAt) lastLocalPayloadTime = data.updatedAt;
          applyState(data, 'local');
        } catch(err) {}
      }
    });

    // 0ms FAST LOCAL TICKER FOR OBS CEF PROCESS ON SAME DEVICE
    setInterval(() => {
      try {
        const raw = localStorage.getItem('sunday_school_taranim_live_presentation');
        if (raw) {
          const data = JSON.parse(raw);
          if (data && data.updatedAt && data.updatedAt > lastLocalPayloadTime) {
            lastLocalPayloadTime = data.updatedAt;
            applyState(data, 'local');
          }
        }
      } catch(e) {}
    }, 30);

    const initialLiveRaw = localStorage.getItem('sunday_school_taranim_live_presentation');
    if (initialLiveRaw) {
      try {
        const data = JSON.parse(initialLiveRaw);
        if (data && data.updatedAt) lastLocalPayloadTime = data.updatedAt;
        applyState(data, 'local');
      } catch(err) {}
    }

    let isFetching = false;
    let lastFetchStartTime = 0;
    let activeLiveApiUrl = null;

    async function fetchLiveHTTP() {
      // IF LOCAL STORAGE / BROADCAST WAS UPDATED IN LAST 4 SECONDS (SAME DEVICE PRESENTER), BYPASS INTERNET HTTP FETCH!
      if (Date.now() - lastLocalPayloadTime < 4000) {
        return;
      }

      // AUTO-HEALING DEADLOCK BREAKER: Reset after 1000ms
      if (isFetching && (Date.now() - lastFetchStartTime > 1000)) {
        isFetching = false;
      }
      if (isFetching || isDragging || (Date.now() - lastDragTime < 1200)) return;
      isFetching = true;
      lastFetchStartTime = Date.now();

      // 800ms abort timeout (was 2000ms) — fail fast, retry fast
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 800);
      const ts = Date.now();

      try {
        let url = activeLiveApiUrl || (getApiUrl() + '?action=live');
        url += (url.includes('?') ? '&' : '?') + '_t=' + ts;

        let res = await fetch(url, { cache: 'no-cache', signal: controller.signal });
        if (res.ok) {
          let data = await res.json();
          if (data && (data.type === 'PRESENT_LINE' || data.text !== undefined)) {
            applyState(data, 'http');
          }
        } else {
          activeLiveApiUrl = null;
          fetchFallbackLive(ts);
        }
      } catch (err) {
        if (!activeLiveApiUrl) {
          fetchFallbackLive(ts);
        } else {
          // Cached URL failed — reset and retry with fallback discovery
          activeLiveApiUrl = null;
        }
      } finally {
        clearTimeout(timeoutId);
        isFetching = false;
      }
    }

    let lastFallbackTime = 0;
    async function fetchFallbackLive(ts) {
      if (Date.now() - lastFallbackTime < 1500) return;
      lastFallbackTime = Date.now();

      const fallbackUrls = [
        'api.php?action=live',
        '../api.php?action=live',
        '/taranim/api.php?action=live',
        '/api.php?action=live'
      ].map(u => u + (u.includes('?') ? '&' : '?') + '_t=' + ts);

      const raceController = new AbortController();
      const raceTimeout = setTimeout(() => raceController.abort(), 800);

      const promises = fallbackUrls.map(url =>
        fetch(url, { cache: 'no-cache', signal: raceController.signal })
          .then(async res => {
            if (res.ok) {
              const data = await res.json();
              if (data && (data.type === 'PRESENT_LINE' || data.text !== undefined)) {
                return { url: url.replace(/[?&]_t=\d+/, ''), data };
              }
            }
            return null;
          })
          .catch(() => null)
      );

      try {
        const results = await Promise.all(promises);
        const winner = results.find(r => r !== null);
        if (winner) {
          raceController.abort();
          activeLiveApiUrl = winner.url;
          applyState(winner.data, 'http');
        }
      } catch(e) {}
      clearTimeout(raceTimeout);
    }

    // WORKER TIMER (80MS TICKS — OPTIMAL FOR MOBILE HOTSPOT & LOCAL DISPLAY SYNC)
    let workerTimer = null;
    try {
      const workerBlob = new Blob([
        "let t = null; onmessage = function(e) { if (e.data === 'start') { clearInterval(t); t = setInterval(function() { postMessage('tick'); }, 80); } else if (e.data === 'stop') { clearInterval(t); } };"
      ], { type: 'application/javascript' });
      workerTimer = new Worker(URL.createObjectURL(workerBlob));
      workerTimer.onmessage = function() { fetchLiveHTTP(); };
      workerTimer.postMessage('start');
    } catch (e) {
      setInterval(fetchLiveHTTP, 80);
    }

    // INITIALIZE INSTANTLY FROM LOCAL STORAGE SETTINGS / LIVE PAYLOAD ON STARTUP
    (function initSavedState() {
      try {
        const savedLive = localStorage.getItem('sunday_school_taranim_live_presentation');
        if (savedLive) {
          const parsedLive = JSON.parse(savedLive);
          applyState(parsedLive, 'local');
        } else {
          const savedSettings = localStorage.getItem('sunday_school_taranim_style_settings');
          if (savedSettings) {
            const parsedSettings = JSON.parse(savedSettings);
            applyState(parsedSettings, 'local');
          }
        }
      } catch(e) {}
    })();

    // IMMEDIATE RE-FETCH ON VISIBILITY OR FOCUS RESTORATION
    window.addEventListener('keydown', (e) => {
      if (e.key === 'h' || e.key === 'H' || e.key === 'ا') {
        document.body.classList.toggle('controls-hidden');
      }
    });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') fetchLiveHTTP();
    });
    window.addEventListener('focus', fetchLiveHTTP);
    window.addEventListener('online', fetchLiveHTTP);
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    }
  </script>
</body>
</html>
